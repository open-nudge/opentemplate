---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
    groups:
      uv:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directories:
      - "/.github"
      # templatedelete-start
      - "/template-setup"
      # templatedelete-end
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
    groups:
      pip:
        patterns:
          - "*"
...
