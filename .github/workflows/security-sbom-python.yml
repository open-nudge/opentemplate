---
name: "Security SBOM Python"

on:
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - "checks_requested"
# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-sbom-python:
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      contents: "read"
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    name: "Security SBOM Python"
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_security-sbom-python.yml"

  # Single required check, as matrix check names change with Python versions.
  security-sbom-python-check:
    name: "Security SBOM Python Check"
    if: >
      failure() || cancelled()
    needs:
      - "security-sbom-python"
    timeout-minutes: 5
    # enq: the only way to set permissions to none in GH Actions
    permissions: {} # yamllint disable-line rule:braces
    runs-on: "ubuntu-latest"
    steps:
      - name: "Fail on failed or cancelled SBOM jobs"
        run: >
          echo "::error::Security SBOM Python jobs failed or were cancelled" && exit 1
...
