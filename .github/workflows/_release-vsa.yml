---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Release VSA"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      digests:
        description: >
          sha256sum of the distributions (release build workflow output),
          job outputs cannot be altered by other jobs, unlike artifacts
        type: "string"
        required: true
      package-name:
        description: "Name of the built package (release build output)"
        type: "string"
        required: true
      package-version:
        description: "Version of the built package (release build output)"
        type: "string"
        required: true

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  release-vsa:
    name: "Release VSA"
    # Condition shared with _release-build.yml (see there)
    if: >
      github.ref_type == 'tag'
      && (vars.NO_GITHUB_ENTERPRISE_CLOUD == '' || github.event.repository.visibility != 'private')
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      attestations: "read" # Needed to download and verify attestations
    outputs:
      predicate: "${{ steps.predicate.outputs.predicate }}"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - name: "Get distributions"
        uses: "$/.github/actions/dist-download"
        with:
          digests: "${{ inputs.digests }}"
      # The policy the VSA attests to (referenced in its predicate)
      - name: "Verify build provenance"
        uses: "$/.github/actions/attestation-verify"
        with:
          directory: "dist"
          bundles: "true"
          signers: |
            {"_release-build": ["*.whl", "*.tar.gz"]}
      # inputAttestations of the VSA are the bundles verified above
      - name: "Get bundle digests"
        id: "bundles"
        uses: "$/.github/actions/digests"
        with:
          directory: "dist"
          paths: "*.sigstore.jsonl"
      # https://slsa.dev/spec/v1.2/verification_summary
      # The template builds itself (no isolation from the project), hence L2
      - name: "Create VSA predicate"
        id: "predicate"
        # enq: URLs cannot be split, jq indentation is more readable
        # yamllint disable rule:indentation rule:line-length
        env:
          VERIFIER: "https://github.com/${{ job.workflow_repository }}/.github/workflows/_release-vsa.yml@${{ job.workflow_sha }}"
          POLICY: "https://github.com/${{ job.workflow_repository }}/blob/${{ job.workflow_sha }}/.github/actions/attestation-verify/action.yml"
          TEMPLATE_SHA: "${{ job.workflow_sha }}"
          LEVEL: "${{ job.workflow_repository == github.repository && 'SLSA_BUILD_LEVEL_2' || 'SLSA_BUILD_LEVEL_3' }}"
          BUNDLES: "${{ steps.bundles.outputs.digests }}"
          PACKAGE_NAME: "${{ inputs.package-name }}"
          PACKAGE_VERSION: "${{ inputs.package-version }}"
        run: |
          predicate="$(jq --null-input --compact-output --arg resource "pkg:pypi/${PACKAGE_NAME//_/-}@${PACKAGE_VERSION}" '{
            verifier: {id: env.VERIFIER},
            timeVerified: (now | todateiso8601),
            resourceUri: $resource,
            policy: {uri: env.POLICY, digest: {gitCommit: env.TEMPLATE_SHA}},
            inputAttestations: [env.BUNDLES | splits("\n") | split("  ") | {uri: .[1], digest: {sha256: .[0]}}],
            verificationResult: "PASSED",
            verifiedLevels: [env.LEVEL],
            slsaVersion: "1.2"
          }')"
          echo "predicate=${predicate}" >> "${GITHUB_OUTPUT}"
        # yamllint enable rule:indentation rule:line-length

  release-vsa-attest:
    name: "Release VSA Attest"
    needs:
      - "release-vsa"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            timestamp.githubapp.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - name: "Attest VSA"
        uses: "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
        with:
          subject-checksums: "${{ inputs.digests }}"
          predicate-type: "https://slsa.dev/verification_summary/v1"
          predicate: "${{ needs.release-vsa.outputs.predicate }}"
...
