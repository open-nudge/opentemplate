---
name: "_Docs"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _docs:
    name: "_Docs"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/__run.yml"
    with:
      command: |
        pdm run check-docs
      group: "docs"
      core: true
      fetch-depth: 0
      sparse-checkout: |
        **.md
        **.py
        mkdocs.yml
      additional-allowed-endpoints: >
        fonts.google.com:443
        fonts.gstatic.com:443
...
