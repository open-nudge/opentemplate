---
name: "YAML"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "**.yml"
      - "**.yaml"
      - ".github/actions/uv-setup/action.yml"
      - ".github/workflows/yaml.yml"
      - ".github/workflows/_yaml.yml"
      - ".github/workflows/_run-check.yml"
      - ".github/workflows/__run.yml"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: "YAML"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/_yaml.yml"
...
