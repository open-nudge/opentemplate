---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Release Check"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _release-check:
    name: "_Release Check"
    permissions:
      contents: "read"
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_run-check.yml"
    with:
      check: "release"
      full-checkout: true

  _release-check-build:
    name: "_Release Check Build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: "read"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
      - name: "Checkout source"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          path: "source"
          fetch-depth: 0
          persist-credentials: false
      - name: "Build distributions"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/dist-build"
...
