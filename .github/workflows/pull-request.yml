---
name: "Pull Request"

on:
  # enq: can be used as it's a low-risk action with no custom code execution
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - "opened"
      - "edited"
      - "synchronize"
      - "reopened"
    branches:
      - "main"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    timeout-minutes: 10
    name: "Pull Request"
    permissions:
      pull-requests: "read" # Needed to process pull request data
    runs-on: "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a" # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: |
            github.com:443
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
      - name: "Lint Pull Request"
        uses: "amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6" # v6.1.2
        with:
          types: |
            fix
            feat
          requireScope: false
          disallowScopes: |
            .+
          subjectPattern: "^(?![A-Z]).+$"
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
...
