---
name: "Template Update"

on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-update:
    name: "Template Update"
    permissions:
      contents: "write" # Needed to update repository contents
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_template-update.yml"
...
