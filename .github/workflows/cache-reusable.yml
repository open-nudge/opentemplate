---
name: "Cache Reusable"

on:
  workflow_call:
    inputs:
      ref:
        description: "The ref to checkout"
        type: "string"
        default: ""

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  # This cache is any OS + multiple Python versions
  core:
    name: >
      Core | ${{ matrix.os.name }}
      | python-${{ matrix.python-version }}
      ${{ matrix.install.all && '| all ' || '| core ' }}
      ${{ matrix.install.group != '' &&
      format('| {0}', matrix.install.group) || '' }}
    strategy:
      fail-fast: true
      matrix:
        install:
          # Main + optional dependencies + release
          - group: "release"
            all: false
          # Main + optional dependencies + tests
          - group: "tests"
            all: false
          # SBOM of the whole project
          - group: ""
            all: true
        python-version:
          #
          #           DO NOT EDIT UNTIL end marker
          #
          # [[[cog
          # import cog
          # import cogeol
          #
          # for version in reversed(cogeol.scientific()):
          #     cycle = version["cycle"]
          #     cog.outl(f'          - "{cycle}"')
          # ]]]
          - "3.12"
          - "3.13"
          - "3.14"
          # [[[end]]] (sum: wgdYaRbI0v)
        os:
          - name: "ubuntu-latest"
            endpoints: ""
          - name: "macos-latest"
            endpoints: |
              bag.itunes.apple.com:443
              cf.iadsdk.apple.com:443
              configuration.apple.com:443
              device-config.pcms.apple.com:443
              iadsdk.apple.com:443
              sas.pcms.apple.com:443
          - name: "windows-latest"
            endpoints: |
              client.wns.windows.com:443
              crl.sectigo.com:443
              ipv6.msftconnecttest.com:443
              mobile.events.data.microsoft.com:443
              ocsp.sectigo.com:443
              www.msftconnecttest.com:443
    permissions:
      contents: "read"
    # enq: hash with name and version always longer than 80 chars
    # yamllint disable rule:line-length
    # enq: unpinned as it allows projects to use the latest
    uses: "$/.github/workflows/cache-item-reusable.yml"
    # yamllint enable rule:line-length
    with:
      group: "${{ matrix.install.group }}"
      core: true
      all: "${{ matrix.install.all }}"
      python-version: "${{ matrix.python-version }}"
      os: "${{ matrix.os.name }}"
      additional-allowed-endpoints: "${{ matrix.os.endpoints }}"
      ref: "${{ github.event.inputs.ref }}"

  dev:
    name: "Dev | ${{ matrix.group}}"
    permissions:
      contents: "read"
    strategy:
      fail-fast: true
      matrix:
        # --no-editable not needed for dev dependencies
        group:
          - "tests"
          - "docs"
          - "python"
          - "typing"
          - "shell"
          - "yaml"
          - "markdown"
          - "ini"
          - "pyproject"
          - "citation"
          - "release"
          - "github"
          - "legal"
          - "generation"
          - "commit"
          - "prek"
          - "text"
          - "json"
          - "json5"
          - "toml"
          - "xml"
    # enq: hash with name and version always longer than 80 chars
    # yamllint disable rule:line-length
    # enq: unpinned as it allows projects to use the latest
    uses: "$/.github/workflows/cache-item-reusable.yml"
    # yamllint enable rule:line-length
    with:
      group: "${{ matrix.group }}"
      ref: "${{ github.event.inputs.ref }}"
...
