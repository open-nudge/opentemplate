---
name: "_Release SARIFs"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  sarifs:
    name: "SARIFs"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      contents: "read" # Needed by the scanners to checkout repository
    uses: "$/.github/workflows/_security-sarifs.yml"

  sarif-attest:
    name: "Sarif Attest"
    # CodeQL may be skipped (NO_GITHUB_CODE_SECURITY variable), other SARIFs are still attested
    if: >
      !cancelled() && !failure()
      && github.ref_type == 'tag'
      && (vars.NO_GITHUB_ENTERPRISE_CLOUD == '' || github.event.repository.visibility != 'private')
    needs: "sarifs"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            timestamp.githubapp.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - name: "Attest SARIFs provenance"
        uses: "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
        with:
          # One digest per line (see _security-sarifs.yml)
          subject-checksums: "${{ needs.sarifs.outputs.digests }}"
...
