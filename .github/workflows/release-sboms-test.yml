---
name: "Release SBOMs Test"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".grype.yaml"
      - ".github/actions/sarif-upload/action.yml"
      - ".github/actions/git-setup/action.yml"
      - ".github/actions/setup-release/action.yml"
      - ".github/requirements.txt"
      - ".github/actions/attestation-verify/action.yml"
      - ".github/actions/digests/action.yml"
      - ".github/actions/digests-verify/action.yml"
      - ".github/actions/dist-download/action.yml"
      - ".github/workflows/release-build-reusable.yml"
      - ".github/workflows/release-sboms-test.yml"
      - ".github/workflows/release-sboms-reusable.yml"
      - ".github/workflows/sbom-reusable.yml"
      - ".github/workflows/security-sbom-github-update.yml"
      - ".github/workflows/security-sbom-github.yml"
      - ".github/workflows/security-sbom-legal-update.yml"
      - ".github/workflows/security-sbom-legal.yml"
      - ".github/workflows/security-sbom-python-reusable.yml"
      - ".github/workflows/security-sbom-python-update.yml"
      - ".github/workflows/security-sbom-python.yml"
      - "pyproject.toml"
  merge_group:
    types:
      - "checks_requested"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

# Attestations are created only on release events, hence skipped here.
# Attestation permissions are still granted as GitHub validates
# nested jobs permissions upfront, even for skipped jobs.
jobs:
  package-create:
    name: "Package Create"
    permissions:
      contents: "read"
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    uses: "$/.github/workflows/release-build-reusable.yml"

  release-sboms-test:
    name: "Release SBOMs Test"
    needs:
      - "package-create"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
      contents: "read"
    uses: "$/.github/workflows/release-sboms-reusable.yml"
    with:
      digests: "${{ needs.package-create.outputs.digests }}"
      upload-grype: false
...
