---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Release Upload"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      digests:
        description: >
          sha256sum of the distributions (release build workflow output),
          job outputs cannot be altered by other jobs, unlike artifacts
        type: "string"
        required: true
      tag:
        description: "Release tag (release-version output), empty for none"
        type: "string"
        required: true
      version:
        description: "Documentation version (vX.Y, release-version output)"
        type: "string"
        required: true

    outputs:
      digests:
        description: "Digests of the release draft artifact (assets and notes)"
        value: "${{ jobs.release-upload.outputs.digests }}"
      docs-digests:
        description: "Digest of the documentation archive (release-docs)"
        value: "${{ jobs.release-upload.outputs.docs-digests }}"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  release-upload:
    name: "Release Upload"
    permissions:
      contents: "read" # Needed to checkout gh-pages
      attestations: "read" # Needed to download and verify attestations
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    outputs:
      digests: "${{ steps.draft.outputs.digests }}"
      docs-digests: "${{ steps.docs.outputs.digests }}"
    env:
      # Condition shared with _release-build.yml (see there)
      ATTESTED: >-
        ${{
        github.ref_type == 'tag'
        && (vars.NO_GITHUB_ENTERPRISE_CLOUD == '' || github.event.repository.visibility != 'private')
        }}
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      # Documentation update is checked here, release.yml pushes it
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "gh-pages"
          persist-credentials: false
      # Release assets are artifacts named <name>-<commit SHA> (flat files),
      # NOTE: no other artifact of the run may end with the commit SHA
      - name: "Download release assets"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          pattern: "*-${{ github.sha }}"
          path: "${{ runner.temp }}/assets"
          merge-multiple: true
      - name: "Download release notes and documentation"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          pattern: "release-{notes,docs}"
          path: "${{ runner.temp }}/unattested"
          merge-multiple: true
      # release.yml publishes the archive verified against this digest
      - name: "Get docs digests"
        id: "docs"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/digests"
        with:
          directory: "${{ runner.temp }}/unattested"
          paths: "site-${{ github.sha }}.tar"
      - name: "Verify distributions"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/digests-verify"
        with:
          digests: "${{ inputs.digests }}"
          directory: "${{ runner.temp }}/assets"
      # Each asset kind has one template signer (keep in sync with the signer
      # table in docs/template/release-your-project/process.md)
      # Without attestations (e.g. pull requests) only the files are checked
      - name: "Verify attestations"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/attestation-verify"
        with:
          directory: "${{ runner.temp }}/assets"
          verify: "${{ env.ATTESTED }}"
          bundles: "true"
          # security- prefix keeps Trivy SARIFs (another signer) out of the
          # scanner glob, CodeQL SARIF is absent if CodeQL was skipped
          # (see _security-codeql.yml)
          # enq: JSON indentation is more readable
          # yamllint disable rule:indentation
          signers: |
            {
              "_release-build": ["*.whl", "*.tar.gz"],
              "_sbom": ["sbom-*.json", "trivy-*.sarif", "trivy-*.yaml"],
              "_release-sarifs": ["security-*-${{ github.sha }}.sarif"]
            }
          # yamllint enable rule:indentation
      # Verified assets have a bundle, unknown ones (e.g. added by any job
      # of the run) must not be attached.
      - name: "Reject unexpected assets"
        working-directory: "${{ runner.temp }}/assets"
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation rule:line-length
        run: |
          for file in *; do
            if [[ "${ATTESTED}" == "true" && "${file}" != *.sigstore.jsonl && ! -f "${file}.sigstore.jsonl" ]]; then
              echo "::error title=Unexpected asset::${file} is not verified"
              exit 1
            fi
          done
        # yamllint enable rule:indentation rule:line-length
      - name: "Create release notes"
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ inputs.tag }}"
          NOTES: "${{ runner.temp }}/unattested/LATEST.md"
        # Annotated tag message (author's notes) precedes the generated
        # changelog. Signed tags end their message with the signature,
        # which the API also returns as verification.signature
        # enq: multiline without char limit more readable
        # yamllint disable rule:indentation rule:line-length
        run: |
          message=""
          if [[ -n "${TAG}" ]]; then
            tag_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
                --jq 'select(.object.type == "tag") | .object.sha'
            )"
            if [[ -n "${tag_sha}" ]]; then
              # enq: $sig is a jq variable, not a shell one
              # shellcheck disable=SC2016
              message="$(
                gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" \
                  --jq '(.verification.signature // "") as $sig | .message | rtrimstr($sig)'
              )"
            fi
          fi
          {
            if [[ -n "${message}" ]]; then
              printf '%s\n\n' "${message}"
            fi
            cat "${NOTES}"
          } > "${RUNNER_TEMP}/assets/notes.md"
        # yamllint enable rule:indentation rule:line-length
      - name: "Update documentation"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/pages-update"
        with:
          archive: "${{ runner.temp }}/unattested/site-${{ github.sha }}.tar"
          version: "${{ inputs.version }}"
      - name: "Get draft digests"
        id: "draft"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/digests"
        with:
          directory: "${{ runner.temp }}/assets"
          paths: "*"
      # Overwritten on re-runs, release.yml verifies it against the digests
      - name: "Upload release draft"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "release-draft"
          path: "${{ runner.temp }}/assets"
          if-no-files-found: "error"
          overwrite: true
...
