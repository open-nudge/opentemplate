---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Security Scorecard"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      name:
        description: "Name of the artifact (default: '' - no artifact upload)"
        type: "string"
        default: ""
      sarif:
        description: "Upload SARIF file to CodeQL"
        type: "boolean"
        default: false
      file:
        description: "Name/path of the created SARIF file"
        type: "string"
        default: "scorecard.sarif"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _security-scorecard:
    name: "_Security Scorecard"
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      id-token: "write" # Needed for GitHub OIDC token if publish_results
      contents: "read"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            github.com:443
            index.docker.io:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Run analysis"
        if: >
          github.event.repository.visibility == 'public'
        # enq: comments and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e" # v2.5.0
        with:
          results_file: "${{ inputs.file }}"
          results_format: "sarif"
          # (Optional) "write" PAT token. Uncomment the `repo_token` line below if:
          # - you want to enable the Branch-Protection check on a *public* repository, or
          # - you are installing Scorecard on a *private* repository
          # To create the PAT, follow the steps in
          # https://github.com/ossf/scorecard-action?tab=readme-ov-file#authentication-with-fine-grained-pat-optional
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

          # Public repositories:
          #   - Publish results to OpenSSF REST API for easy access by consumers
          #   - Allows the repository to include the Scorecard badge.
          #   - See https://github.com/ossf/scorecard-action#publishing-results.
          # For private repositories:
          #   - `publish_results` will always be set to `false`, regardless
          #     of the value entered here.
          publish_results: "${{ inputs.sarif }}"
          # yamllint enable rule:line-length
          # Everything below is the same as ../actions/sarif-upload/action.yml
          # but had to be copy-pasted, as ossf/scorecard-action verifies
          # this job when publishing results (only allowlisted actions,
          # no run steps), which rejects local composite actions
      - name: "Upload artifact"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        if: >
          inputs.name != ''
        with:
          name: "${{ inputs.name }}"
          path: "${{ inputs.file }}"
          retention-days: 7
          overwrite: true
      - name: "Upload SARIF file to GitHub Advanced Security Dashboard"
        if: >
          inputs.sarif
        # SARIF upload may fail if there is no integration enabled
        continue-on-error: true
        uses: "github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee" # v4.39.0
        with:
          sarif_file: "${{ inputs.file }}"
          category: "/tool:scorecard/scope:repository/language:all"
...
