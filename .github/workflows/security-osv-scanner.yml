---
name: "Security OSV-Scanner"

on:
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - "checks_requested"
  push:
    branches:
      - "main"
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-osv-scanner:
    permissions:
      contents: "read"
    name: "Security OSV-Scanner"
    uses: "$/.github/workflows/security-osv-scanner-reusable.yml"
    with:
      name: "osv-scanner"

  # Separate job, so PRs (which do not upload) run without write permissions
  security-osv-scanner-upload:
    name: "Security OSV-Scanner Upload"
    needs: "security-osv-scanner"
    # Also on failure, so findings reach the Security tab
    if: >
      !cancelled()
      && github.event_name != 'pull_request'
      && github.event_name != 'merge_group'
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
    uses: "$/.github/workflows/security-upload-reusable.yml"
    with:
      name: "osv-scanner"
      category: "/tool:osv-scanner/scope:dependencies/language:python"
...
