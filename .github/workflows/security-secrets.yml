---
name: "Security Secrets"

on:
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-secrets:
    timeout-minutes: 10
    permissions:
      # Only need to read contents
      contents: "read"
    name: "Security Secrets"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        # yamllint enable rule:line-length
        with:
          # Uses docker container,
          # disable-sudo-and-containers impossible
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            api.github.com:443
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
      - name: "Checkout repository"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        # yamllint enable rule:line-length
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "TruffleHog OSS"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6" # v3.97.5
        # yamllint enable rule:line-length
        with:
          extra_args: "--debug --only-verified"
...
