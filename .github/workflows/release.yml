---
name: "Release"

on:
  push:
    tags:
      - "*"
  # Only tag refs run (see release job), branch refs skip every job
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "none"

# One run per release (workflow_ref contains the tag), never cancelled
# as cancellation could interrupt publishing
concurrency:
  group: >
    ${{ github.workflow_ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Release"
    if: >
      github.ref_type == 'tag'
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to security tab
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
      contents: "read"
      pull-requests: "read" # Needed to read PR metadata during changelog gen
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_release.yml"

  release-draft:
    name: "Release Draft"
    needs:
      - "release"
    permissions:
      contents: "write" # Needed to create the draft release
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            uploads.github.com:443
      - name: "Download release draft"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "release-draft"
          path: "${{ runner.temp }}/draft"
      # Other jobs of the run can replace the artifact, but not job outputs
      - name: "Verify release draft"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/digests-verify"
        with:
          directory: "${{ runner.temp }}/draft"
          digests: "${{ needs.release.outputs.draft-digests }}"
          exact: "true"
      - name: "Check existing release"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        # enq: multiline without char limit more readable
        # yamllint disable rule:indentation rule:line-length
        run: |
          draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null || echo "none")"
          case "${draft}" in
            "none") ;;
            "true") gh release delete "${GITHUB_REF_NAME}" --yes ;;
            *)
              echo "::error title=Release already published::${GITHUB_REF_NAME} is immutable, push a new tag instead"
              exit 1
              ;;
          esac
        # yamllint enable rule:indentation rule:line-length
      - name: "Create draft release"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          ASSETS: "${{ runner.temp }}/draft"
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation
        run: |
          mv "${ASSETS}/notes.md" "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" "${ASSETS}"/* \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
        # yamllint enable rule:indentation

  package-upload:
    name: "Package Upload"
    # Irreversible: runs once every asset is verified and attached to the draft
    needs:
      - "release"
      - "release-draft"
    # Must match the environment registered as PyPI trusted publisher
    environment: "pypi"
    permissions:
      id-token: "write" # Needed for trusted publishing and PyPI attestations
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    # Change to the opentemplate reusable workflow
    # once the issue below is resolved for SLSA3 compatibility
    # https://github.com/pypi/warehouse/issues/11096
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            pypi.python.org:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            upload.pypi.org:443
      # Other jobs of the run can replace the artifact, but not job outputs
      - name: "Get distributions"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/dist-download"
        with:
          digests: "${{ needs.release.outputs.digests }}"
      # PyPI accepts identical re-uploads (re-runs) and rejects changed files
      - name: "Upload python package"
        if: >
          ! github.event.repository.private
        uses: "pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086" # v1.14.3
        with:
          print-hash: true

  release-publish:
    name: "Release Publish"
    # Publishing makes the release (assets and tag) immutable.
    # package-upload succeeds only if every other job did (transitively),
    # otherwise the release stays an (unpublished) draft.
    needs:
      - "package-upload"
    permissions:
      contents: "write" # Needed to publish the draft release
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            api.github.com:443
      - name: "Publish draft release"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: >
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

  # Same update as checked by _release-upload.yml, now pushed
  docs-publish:
    name: "Docs Publish"
    needs:
      - "release"
      - "release-publish"
    permissions:
      contents: "write" # Needed to push documentation to gh-pages
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
      # enq: credentials kept for git push
      - name: "Checkout repository"  # zizmor: ignore[artipacked]
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "gh-pages"
      - name: "Download documentation"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "release-docs"
          path: "${{ runner.temp }}/docs"

      - name: "Verify documentation"
        # Other jobs of the run can replace the artifact, but not job outputs
        # so we compare the digests here
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/digests-verify"
        with:
          directory: "${{ runner.temp }}/docs"
          digests: "${{ needs.release.outputs.docs-digests }}"
          exact: "true"
      - name: "Update documentation"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/pages-update"
        with:
          archive: "${{ runner.temp }}/docs/site-${{ github.sha }}.tar"
          version: "${{ needs.release.outputs.version }}"
      - name: "Setup git"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/git-setup"
      - name: "Commit documentation"
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation
        run: |
          git add --force --all
          # Nothing is committed if the documentation is unchanged (re-runs)
          if ! git diff --cached --quiet; then
            git commit --message "feat: update ${GITHUB_REF_NAME} [skip ci]"
          fi
        # yamllint enable rule:indentation
      - name: "Push documentation"
        run: >
          git push origin gh-pages
      - name: "Upload documentation as Pages artifact"
        uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
        with:
          path: "."

  docs-deploy:
    name: "Docs Deploy"
    # Pages artifact (gh-pages branch content) uploaded by docs-publish
    needs:
      - "docs-publish"
    if: >
      github.event.repository.has_pages
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    permissions:
      pages: "write" # Needed to deploy to GitHub Pages
      id-token: "write" # Needed to verify the deployment originates from here
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
      - name: "Deploy documentation to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1
...
