---
name: "Release"

on:
  push:
    tags:
      - "*"
  # Only tag refs run (see root jobs), branch refs skip every job
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "none"

# One run per release (workflow_ref contains the tag), never cancelled
# as cancellation could interrupt publishing
concurrency:
  group: >
    ${{ github.workflow_ref }}
  cancel-in-progress: false

jobs:
  sboms:
    name: "SBOMs"
    needs:
      - "package-create"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to security tab
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
      contents: "read"
    uses: "$/.github/workflows/release-sboms-reusable.yml"
    with:
      digests: "${{ needs.package-create.outputs.digests }}"

  sarifs:
    name: "SARIFs"
    # Root job: branch refs (workflow_dispatch) skip the whole run
    if: >
      github.ref_type == 'tag'
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to security tab
      contents: "read" # Needed by the scanners to checkout repository
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    uses: "$/.github/workflows/release-sarifs-reusable.yml"

  tests:
    name: "Tests"
    # Root job: branch refs (workflow_dispatch) skip the whole run
    if: >
      github.ref_type == 'tag'
    permissions:
      contents: "read"
    uses: "$/.github/workflows/tests-reusable.yml"

  docs:
    name: "Docs"
    # Root job: branch refs (workflow_dispatch) skip the whole run
    if: >
      github.ref_type == 'tag'
    permissions:
      contents: "read"
    uses: "$/.github/workflows/release-docs-reusable.yml"

  # Works regardless of repo type
  package-create:
    name: "Package Create"
    # Root job: branch refs (workflow_dispatch) skip the whole run
    if: >
      github.ref_type == 'tag'
    permissions:
      contents: "read"
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    uses: "$/.github/workflows/release-build-reusable.yml"

  changelog:
    name: "Changelog"
    needs:
      - "sboms"
      - "sarifs"
      - "tests"
      - "docs"
      - "package-create"
    permissions:
      contents: "read"
      pull-requests: "read" # Needed to read PR metadata during changelog gen
    uses: "$/.github/workflows/release-changelog-reusable.yml"
    with:
      package-name: "${{ needs.package-create.outputs.package-name }}"
      package-version: "${{ needs.package-create.outputs.package-version }}"

  github-upload:
    name: "GitHub Upload"
    needs:
      - "changelog"
      - "package-create"
    permissions:
      contents: "write" # Needed to create the draft release
      attestations: "read" # Needed to verify release assets
    uses: "$/.github/workflows/release-upload.yml"
    with:
      digests: "${{ needs.package-create.outputs.digests }}"

  docs-deploy:
    name: "Docs Deploy"
    # Pages artifact (gh-pages branch content) uploaded by github-upload
    needs:
      - "github-upload"
    if: >
      github.event.repository.has_pages
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    permissions:
      pages: "write" # Needed to deploy to GitHub Pages
      id-token: "write" # Needed to verify the deployment originates from here
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
      - name: "Deploy documentation to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1

  package-upload:
    name: "Package Upload"
    # Irreversible: runs once every asset is verified and attached to the draft
    needs:
      - "github-upload"
      - "package-create"
    # Must match the environment registered as PyPI trusted publisher
    environment: "pypi"
    permissions:
      id-token: "write" # Needed for trusted publishing and PyPI attestations
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    # Change to the opentemplate reusable workflow
    # once the issue below is resolved for SLSA3 compatibility
    # https://github.com/pypi/warehouse/issues/11096
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            pypi.python.org:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            upload.pypi.org:443
      # Other jobs of the run can replace the artifact, but not job outputs
      - name: "Get distributions"
        uses: "$/.github/actions/dist-download"
        with:
          digests: "${{ needs.package-create.outputs.digests }}"
      - name: "Upload python package"
        if: >
          ! github.event.repository.private
        uses: "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33" # v1.14.2
        with:
          print-hash: true

  release-publish:
    name: "Release Publish"
    # Last, publishing makes the release (assets and tag) immutable.
    # package-upload succeeds only if every other job did (transitively),
    # otherwise the release stays an (unpublished) draft.
    needs:
      - "package-upload"
    permissions:
      contents: "write" # Needed to publish the draft release
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            api.github.com:443
      - name: "Publish draft release"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: >
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
...
