---
name: "Release"

on:
  release:
    types:
      - "published"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "none"

# One run per release (workflow_ref contains the tag), never cancelled
# as cancellation could interrupt publishing
concurrency:
  group: >
    ${{ github.workflow_ref }}
  cancel-in-progress: false

jobs:
  sboms:
    name: "SBOMs"
    needs:
      - "package-create"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to security tab
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
      contents: "read"
    uses: "$/.github/workflows/release-sboms-reusable.yml"
    with:
      digests: "${{ needs.package-create.outputs.digests }}"

  sarifs:
    name: "SARIFs"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to security tab
      contents: "read"
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    uses: "$/.github/workflows/release-sarifs-reusable.yml"

  tests:
    name: "Tests"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/tests-reusable.yml"

  docs:
    name: "Docs"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/release-docs-reusable.yml"

  # Works regardless of repo type
  package-create:
    name: "Package Create"
    permissions:
      contents: "read"
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    uses: "$/.github/workflows/release-build-reusable.yml"

  changelog:
    name: "Changelog"
    needs:
      - "sboms"
      - "sarifs"
      - "tests"
      - "docs"
      - "package-create"
    permissions:
      contents: "read"
      pull-requests: "read" # Needed to read PR metadata during changelog gen
    uses: "$/.github/workflows/release-changelog-reusable.yml"
    with:
      package-name: "${{ needs.package-create.outputs.package-name }}"
      package-version: "${{ needs.package-create.outputs.package-version }}"

  github-upload:
    name: "GitHub Upload"
    needs:
      - "changelog"
      - "package-create"
    permissions:
      contents: "write" # Needed to push to the release
      attestations: "read" # Needed to verify release assets
    uses: "$/.github/workflows/release-upload.yml"
    with:
      digests: "${{ needs.package-create.outputs.digests }}"

  package-upload:
    name: "Package Upload"
    # Last, as the only irreversible step: runs once every asset is verified
    needs:
      - "github-upload"
      - "package-create"
    permissions:
      id-token: "write" # Needed for trusted publishing and PyPI attestations
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    # Change to the opentemplate reusable workflow
    # once the issue below is resolved for SLSA3 compatibility
    # https://github.com/pypi/warehouse/issues/11096
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            pypi.python.org:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            upload.pypi.org:443
      # Other jobs of the run can replace the artifact, but not job outputs
      - name: "Get distributions"
        uses: "$/.github/actions/dist-download"
        with:
          digests: "${{ needs.package-create.outputs.digests }}"
      - name: "Upload python package"
        if: >
          ! github.event.repository.private
        uses: "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33" # v1.14.2
        with:
          print-hash: true

  mark-release-untrustworthy:
    name: "Mark Release Untrustworthy"
    # package-upload succeeds only if every other job did (transitively),
    # always(): cancelled runs must be marked too
    needs:
      - "package-upload"
    if: >-
      always() && needs.package-upload.result != 'success'
    permissions:
      contents: "write" # Needed to mark the release untrustworthy
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    env:
      GH_TOKEN: "${{ github.token }}"
      GH_REPO: "${{ github.repository }}"
      TAG: "${{ github.event.release.tag_name }}"
      RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    steps:
      - name: "Mark release as untrustworthy"
        # enq: multiline warning script has readable indentation
        # yamllint disable rule:indentation rule:line-length
        run: |
          title="!!! UNTRUSTED !!!"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          cat > "${notes_file}" <<EOF
          > [!CAUTION]
          > **Trust warning:** This release is not trustworthy because its release workflow did not complete successfully.
          > See [the release workflow run](${RUN_URL}) for details.

          > [!IMPORTANT]
          > Do not use any assets of this release.

          > [!CAUTION]
          > **If you see this release please open a new issue titled "Remove untrusted release", thank you!**
          EOF

          gh release edit "${TAG}" --title "${title}" --notes-file "${notes_file}" --latest=false --prerelease
        # yamllint enable rule:indentation rule:line-length
...
