---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Release Docs"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      version:
        description: "Documentation version (vX.Y, release-version output)"
        type: "string"
        required: true

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  release-docs:
    name: "Release Docs"
    permissions:
      contents: "read"
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_run.yml"
    with:
      # Double checkout used to refresh the content of generated docs, which
      # happens on some linux distributions at least.
      # Version is validated (vX.Y) by the release-version action.
      # enq: long command, splitting is unreadable
      # yamllint disable rule:line-length
      command: |
        TAG="${{ inputs.version }}"
        uv run mike deploy "${TAG}" --branch "site-${GITHUB_SHA}" --ignore-remote-status
        git checkout "site-${GITHUB_SHA}" -- .
        mv "${TAG}" "site-${GITHUB_SHA}"
        tar -cf "site-${GITHUB_SHA}.tar" --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner "site-${GITHUB_SHA}"
      # yamllint enable rule:line-length
      group: "docs"
      core: true
      fetch-depth: 0
      full-checkout: true
      additional-allowed-endpoints: >
        fonts.google.com:443
        fonts.gstatic.com:443
      # Documentation, not a release asset, hence no commit SHA suffix
      upload-name: "release-docs"
      upload-path: "site-${{ github.sha }}.tar"
...
