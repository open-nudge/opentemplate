---
name: "Harden"

on:
  workflow_dispatch:
    inputs:
      organization:
        description: "Account/organization plan"
        type: "choice"
        options:
          - "Free"
          - "Pro/Team"
          - "Enterprise"
      contributors:
        description: "Number of contributors (including you)"
        type: "choice"
        default: "1 (solo)"
        options:
          - "1 (solo)"
          - "2"
          - "3 (or more)"
        required: true
      release-reviewers:
        description: >-
          PyPI release approvers: GitHub usernames (e.g. "alice, bob").
          Together with release-teams: at most 6 entries covering at least
          2 distinct people (if 2 or more contributors)
        type: "string"
        default: ""
        required: false
      release-teams:
        description: >-
          PyPI release approver teams: organization team slugs (e.g. "core").
          Counts toward the 6-entry limit shared with release-reviewers
        type: "string"
        default: ""
        required: false

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}

jobs:
  globalize:
    name: "Globalize workflows"
    if: >
      github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/master'
    permissions:
      contents: "write" # Needed to commit globalized workflow references.
    timeout-minutes: 30
    runs-on: "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
      - name: "Wait for template setup to finish (guard)"
        env:
          GH_TOKEN: "${{ github.token }}"
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation rule:line-length
        run: |
          printf "Waiting for branch 'gh-pages' to exist on GitHub...\n"

          while true; do
            if gh api "repos/${GITHUB_REPOSITORY}/branches/gh-pages" &>/dev/null; then
              printf "Branch 'gh-pages' exists!\n"
              break
            fi

            sleep 1
          done
        # yamllint enable rule:indentation rule:line-length
      - name: "Checkout latest target branch"
        # enq: Checkout credentials are required by the following globalization push.
        # zizmor: ignore[artipacked]
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          # enq: Bootstrap PAT authorizes the commit that globalizes workflow references.
          token: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
          ref: "${{ github.ref_name }}"
          persist-credentials: true
      - name: "Setup git"
        uses: "$/.github/actions/git-setup"
      - name: "Globalize workflows"
        run: "bash .github/reusability/globalize.sh"
      - name: "Commit and push changes"
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: |
          git add --all .github
          if ! git diff --cached --quiet; then
            git commit -s -m "Globalize GitHub Actions workflows"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
        # yamllint enable rule:indentation
  harden:
    name: "Harden"
    needs: "globalize"
    # Run only on main/master branches
    if: >
      github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/master'
    permissions:
      contents: "read"
      issues: "write" # Needed to close the issue
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
      - name: "Normalize type of account/organization"
        id: "organization"
        env:
          ORGANIZATION: "${{ inputs.organization }}"
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: |
          case "${ORGANIZATION}" in
            "Free")
              echo "type=free" >> "${GITHUB_OUTPUT}"
              ;;
            "Pro/Team")
              echo "type=pro" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "type=enterprise" >> "${GITHUB_OUTPUT}"
              ;;
          esac
        # yamllint enable rule:indentation
      - name: "Normalize contributors"
        id: "contributors"
        env:
          CONTRIBUTORS: "${{ inputs.contributors }}"
        # Required pull request approvals (author excluded)
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: |
          case "${CONTRIBUTORS}" in
            "1 (solo)")
              echo "approvals=0" >> "${GITHUB_OUTPUT}"
              ;;
            "2")
              echo "approvals=1" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "approvals=2" >> "${GITHUB_OUTPUT}"
              ;;
          esac
        # yamllint enable rule:indentation
      - name: "Parse PyPI release approvers"
        # Runs before any change, so invalid approvers fail the setup early.
        # Self-review prevention needs at least 2 distinct approvers (users and team
        # members), otherwise a sole approver publishing a release could
        # never approve its deployment (deadlock).
        # Required reviewers in private repositories need Enterprise plan
        id: "release-input"
        env:
          RELEASE_REVIEWERS: "${{ inputs.release-reviewers }}"
          RELEASE_TEAMS: "${{ inputs.release-teams }}"
          # GitHub limit on environment reviewers (users and teams combined)
          MAX_REVIEWERS: "6"
          REQUIRE_REVIEWERS: >-
            ${{ steps.contributors.outputs.approvals != '0'
            && (github.event.repository.visibility == 'public'
            || steps.organization.outputs.type == 'enterprise')
            && 'true' || 'false' }}
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: |
          fail() { echo "::error::$*"; exit 1; }
          if [ "${REQUIRE_REVIEWERS}" != "true" ]; then
            if [ -n "${RELEASE_REVIEWERS}${RELEASE_TEAMS}" ]; then
              echo "::warning::release reviewers/teams ignored (solo or plan without environment reviewers)"
            fi
            echo "required=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          read -r -a users <<< "${RELEASE_REVIEWERS//,/ }"
          read -r -a teams <<< "${RELEASE_TEAMS//,/ }"
          if (( ${#users[@]} + ${#teams[@]} > MAX_REVIEWERS )); then
            fail "At most ${MAX_REVIEWERS} release reviewers and teams combined are allowed"
          fi
          for entry in "${users[@]}" "${teams[@]}"; do
            [[ "${entry}" =~ ^[A-Za-z0-9._-]+$ ]] \
              || fail "Invalid release reviewer or team: ${entry}"
          done
          {
            echo "required=true"
            echo "users=${users[*]}"
            echo "teams=${teams[*]}"
          } >> "${GITHUB_OUTPUT}"
        # yamllint enable rule:indentation
      - name: "Resolve PyPI release reviewer users"
        id: "release-users"
        if: >
          steps.release-input.outputs.required == 'true'
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
          USERS: "${{ steps.release-input.outputs.users }}"
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: |
          fail() { echo "::error::$*"; exit 1; }
          user_id() { gh api "users/$1" --jq 'select(.type == "User") | .id'; }
          add() {
            jq -c --argjson id "$1" --arg login "$2" \
              '.reviewers += [{type: "User", id: $id}] | .people += [$login]'
          }
          resolved='{"reviewers":[],"people":[]}'
          read -r -a users <<< "${USERS}"
          for user in "${users[@]}"; do
            if ! id=$(user_id "${user}") || [ -z "${id}" ]; then
              fail "Release reviewer '${user}' is not an existing GitHub user"
            fi
            resolved=$(add "${id}" "${user}" <<< "${resolved}")
          done
          echo "resolved=${resolved}" >> "${GITHUB_OUTPUT}"
        # yamllint enable rule:indentation
      - name: "Resolve PyPI release reviewer teams"
        id: "release-teams"
        if: >
          steps.release-input.outputs.required == 'true'
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
          OWNER: "${{ github.repository_owner }}"
          TEAMS: "${{ steps.release-input.outputs.teams }}"
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: |
          fail() { echo "::error::$*"; exit 1; }
          team_id() { gh api "orgs/${OWNER}/teams/$1" --jq '.id'; }
          team_members() {
            gh api --paginate "orgs/${OWNER}/teams/$1/members" --jq '.[].login'
          }
          add() {
            jq -c --argjson id "$1" --arg members "$2" \
              '.reviewers += [{type: "Team", id: $id}]
              | .people += ($members | split("\n") | map(select(. != "")))'
          }
          resolved='{"reviewers":[],"people":[]}'
          read -r -a teams <<< "${TEAMS}"
          for slug in "${teams[@]}"; do
            id=$(team_id "${slug}") \
              || fail "Release team '${slug}' not found in ${OWNER} (or token lacks members:read)"
            members=$(team_members "${slug}") \
              || fail "Could not list members of release team '${slug}'"
            resolved=$(add "${id}" "${members}" <<< "${resolved}")
          done
          echo "resolved=${resolved}" >> "${GITHUB_OUTPUT}"
        # yamllint enable rule:indentation
      - name: "Validate PyPI release approvers"
        id: "release-approvers"
        if: >
          steps.release-input.outputs.required == 'true'
        env:
          USERS: "${{ steps.release-users.outputs.resolved }}"
          TEAMS: "${{ steps.release-teams.outputs.resolved }}"
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: |
          fail() { echo "::error::$*"; exit 1; }
          merged() {
            jq -c -n --argjson users "${USERS}" --argjson teams "${TEAMS}" \
              "{users: \$users, teams: \$teams} | $1"
          }
          count=$(merged '.users.people + .teams.people
            | map(ascii_downcase) | unique | length')
          users=$(merged '.users.reviewers | length')
          teams=$(merged '.teams.reviewers | length')
          echo "::notice::Found ${count} distinct reviewer(s) (${users} user(s), ${teams} team(s))"
          if [ "${count}" -lt 2 ]; then
            fail "Release reviewers/teams must cover at least 2 distinct people (got ${count})"
          fi
          body=$(merged '{prevent_self_review: true,
            reviewers: (.users.reviewers + .teams.reviewers | unique)}')
          echo "body=${body}" >> "${GITHUB_OUTPUT}"
        # yamllint enable rule:indentation
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          sparse-checkout: |
            .github/rulesets
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: "Adjust reviewers in rulesets"
        env:
          REVIEWERS: "${{ steps.contributors.outputs.approvals }}"
          LAST_PUSH_APPROVAL: >-
            ${{ steps.contributors.outputs.approvals != '0' && 'true' || 'false' }}
        run: >
          sed -i
          -e "s/\"PLACEHOLDER_REVIEWERS\"/${REVIEWERS}/g"
          -e "s/\"PLACEHOLDER_LAST_PUSH_APPROVAL\"/${LAST_PUSH_APPROVAL}/g"
          .github/rulesets/branch-default.json
      - name: "Apply rulesets (public/enterprise/pro/team only)"
        # Administration write
        # https://docs.github.com/en/rest/repos/rules?apiVersion=2022-11-28#create-a-repository-ruleset
        if: >
          github.event.repository.visibility == 'public'
          || steps.organization.outputs.type == 'enterprise'
          || steps.organization.outputs.type == 'pro'
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
        run: >
          find .github/rulesets -name "*.json" -print0
          | parallel -0 -j0 --halt now,fail=1
          "gh api --method POST repos/${GITHUB_REPOSITORY}/rulesets --input {}"
      - name: "Enable GitHub Pages (public/enterprise only)"
        # Administration AND Pages write
        # https://docs.github.com/en/rest/pages/pages?apiVersion=2022-11-28#create-a-github-pages-site
        if: >
          github.event.repository.visibility == 'public'
          || steps.organization.outputs.type == 'enterprise'
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
        run: >
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages"
          -f "source[branch]=gh-pages" -f "source[path]=/"
          -f "build_type=legacy"
      - name: "Apply general settings for the repository"
        # Administration write
        # https://docs.github.com/en/rest/repos/repos?apiVersion=2022-11-28#update-a-repository
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
          # enq: one line is more readable in this case
          # yamllint disable rule:line-length
          HOMEPAGE: >-
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # yamllint enable rule:line-length
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: >
          cat <<EOF | gh api --method PATCH "repos/${GITHUB_REPOSITORY}" --input -
            {
              "allow_auto_merge": true,
              "allow_merge_commit": false,
              "allow_rebase_merge": false,
              "allow_squash_merge": true,
              "allow_update_branch": true,
              "delete_branch_on_merge": true,
              "use_squash_pr_title_as_default": true,
              "has_issues": true,
              "has_projects": true,
              "has_wiki": false,
              "homepage": "${HOMEPAGE}",
              "squash_merge_commit_title": "PR_TITLE",
              "squash_merge_commit_message": "COMMIT_MESSAGES",
              "web_commit_signoff_required": true
            }
          EOF
        # yamllint enable rule:indentation
      - name: "Enable security features for the repository (best effort)"
        # Administration write
        # https://docs.github.com/en/rest/repos/repos?apiVersion=2022-11-28#update-a-repository
        continue-on-error: true
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
        # enq: indentation disabled to aid bash script readability
        # yamllint disable rule:indentation
        run: >
          cat <<EOF | gh api --method PATCH "repos/${GITHUB_REPOSITORY}" --input -
            {
              "security_and_analysis": {
                "advanced_security": {
                  "status": "enabled"
                },
                "secret_scanning": {
                  "status": "enabled"
                },
                "secret_scanning_ai_detection": {
                  "status": "enabled"
                },
                "secret_scanning_push_protection": {
                  "status": "enabled"
                },
                "secret_scanning_non_provider_patterns": {
                  "status": "enabled"
                }
              }
            }
          EOF
        # yamllint enable rule:indentation
      - name: "Enable discussions"
        # Discussions cannot be managed via API currently
        # See here: https://github.com/orgs/community/discussions/46930
        # Administration write
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
        run: >
          gh repo edit --enable-discussions=true
      - name: "Enable immutable releases"
        # Administration write
        # https://docs.github.com/en/rest/repos/repos?apiVersion=2022-11-28#enable-immutable-releases
        # More info:
        # https://docs.github.com/en/code-security/concepts/supply-chain-security/immutable-releases
        env:
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
        run: >
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/immutable-releases"
      - name: "Enable private vulnerability reporting (public only)"
        # Administration write
        # https://docs.github.com/en/rest/repos/repos?apiVersion=2022-11-28#enable-private-vulnerability-reporting-for-a-repository
        # More info:
        # https://docs.github.com/en/code-security/security-advisories/guidance-on-reporting-and-writing-information-about-vulnerabilities/privately-reporting-a-security-vulnerability
        if: >
          github.event.repository.visibility == 'public'
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
        run: >
          gh api --method PUT
          "repos/${GITHUB_REPOSITORY}/private-vulnerability-reporting"
      - name: "Enable vulnerability alerts (public only)"
        # Administration write
        # https://docs.github.com/en/rest/repos/repos?apiVersion=2022-11-28#enable-vulnerability-alerts
        # More info:
        # https://docs.github.com/en/code-security/dependabot/dependabot-alerts/about-dependabot-alerts
        if: >
          github.event.repository.visibility == 'public'
        env:
          # enq: One-time short-lived token (1 day).
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
        run: >
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/vulnerability-alerts"
      - name: "Create PyPI release environment (public/enterprise/pro/team only)"
        # Administration write
        # https://docs.github.com/en/rest/deployments/environments?apiVersion=2022-11-28#create-or-update-an-environment
        if: >
          github.event.repository.visibility == 'public'
          || steps.organization.outputs.type == 'enterprise'
          || steps.organization.outputs.type == 'pro'
        env:
          # enq: This workflow is deleted after setup, so it is not a security threat.
          GH_TOKEN: "${{ secrets.TEMPLATE_GITHUB_TOKEN }}" # zizmor: ignore[secrets-outside-env]
          BODY: "${{ steps.release-approvers.outputs.body || '{}' }}"
        run: >
          printf '%s' "${BODY}" | gh api --method PUT
          "repos/${GITHUB_REPOSITORY}/environments/pypi" --input -
      - name: "Close the issue"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: >
          gh issue close 1 --reason "completed"

  # Update security-scorecard as hardening increases the score significantly
  hardened-scorecard:
    needs: "harden"
    name: "Hardened Scorecard"
    permissions:
      # Required to upload SARIF file to CodeQL.
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Writing security events to upload SARIF file
      contents: "read"
      id-token: "write" # Needed for GitHub OIDC token if publish_results
    uses: "$/.github/workflows/security-scorecard-reusable.yml"
    with:
      sarif: true
...
