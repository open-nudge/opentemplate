---
name: "Generation Reusable"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  generation-reusable:
    name: "Generation Reusable"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/run-check-reusable.yml"
    with:
      check: "generation"
      full-checkout: true
      additional-allowed-endpoints: >
        endoflife.date:443
...
