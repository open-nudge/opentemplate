---
name: "_GitHub Workflows"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _github-workflows:
    name: "_GitHub Workflows"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/_run-check.yml"
    with:
      check: "github-workflows"
      arguments: ".github/workflows/*.yml"
      group: "github"
      sparse-checkout: |
        .github/workflows
      cone: true
...
