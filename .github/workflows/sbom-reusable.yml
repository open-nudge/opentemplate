---
#
# enq: reusable workflows offload concurrency limits to the caller
name: "SBOM Reusable"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      type:
        description: "Type of SBOM to create, runs sbom-<type> pdm script"
        type: "string"
        required: true
      name:
        description: "Name of the SBOM artifact (defaults to type)"
        type: "string"
        default: ""
      groups:
        description: "Dependency groups (pdm sync flags) of the assessed env"
        type: "string"
        default: ""
      os:
        description: "Operating system to run on"
        type: "string"
        default: "ubuntu-latest"
      python-version:
        description: "Python version used to create the SBOM"
        type: "string"
        #
        #           DO NOT EDIT UNTIL end marker
        #
        # [[[cog
        # import cog
        # import cogeol
        #
        # cycle = cogeol.scientific()[-1]["cycle"]
        # cog.out(f'        default: "{cycle}"')
        # ]]]
        default: "3.12"
        # [[[end]]] (sum: lAlMRZbmJy)
      ref:
        description: "The ref to checkout"
        type: "string"
        default: ""
      digests:
        description: >
          sha256sum of the distributions (release build workflow output),
          if given they are installed into the assessed environment
          and the SBOM is attested against them
        type: "string"
        default: ""
      upload-grype:
        description: "Upload the Grype SARIF to Security tab"
        type: "boolean"
        default: false

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

defaults:
  run:
    shell: "bash"

env:
  ARTIFACT: "sbom-${{ inputs.name || inputs.type }}-${{ github.sha }}"

jobs:
  sbom-create:
    name: "SBOM Create"
    runs-on: "${{ inputs.os }}"
    timeout-minutes: 30
    permissions:
      contents: "read"
    outputs:
      digests: "${{ steps.digests.outputs.digests }}"
    env:
      # Only an assessed environment (groups) contains the distributions
      INSTALL_PROJECT: "${{ inputs.digests != '' && inputs.groups != '' }}"
      PDM_VENV_WITH_PIP: "true"
      # Template workflows and actions are part of the release process
      SBOM_ACTIONS_EXTRA: "${{ github.workspace }}/template/.github"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            grype.anchore.io:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            toolbox-data.anchore.io:443
      - name: "Checkout source"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.ref }}"
          path: "source"
          persist-credentials: false
      # SBOM timestamps are derived from the source commit time
      - name: "Setup reproducibility"
        uses: "$/.github/actions/reproducibility-setup"
        with:
          path: "source"
      - name: "Setup template release tools"
        uses: "$/.github/actions/setup-release"
        with:
          python-version: "${{ inputs.python-version }}"
          sparse-checkout: >-
            ${{ inputs.type == 'actions' && '/.github/' || '' }}
      # Only releases have distributions
      - name: "Get verified distributions"
        if: >
          env.INSTALL_PROJECT == 'true'
        uses: "$/.github/actions/dist-download"
        with:
          digests: "${{ inputs.digests }}"
      # Identity is part of the legal SBOM
      - name: "Setup git identity"
        uses: "$/.github/actions/git-setup"
      # Grype configuration is project specific (e.g. ignored findings)
      - name: "Create directory for SBOM"
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation
        run: |
          mkdir "${ARTIFACT}"
          if [[ -f source/.grype.yaml ]]; then
            cp source/.grype.yaml .
          fi
        # yamllint enable rule:indentation
      - name: "Install assessed environment"
        if: >
          inputs.groups != ''
        env:
          DEPENDENCY_GROUPS: "${{ inputs.groups }}"
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation
        run: |
          # Local PDM configuration must not alter the assessed environment
          rm -rf source/__pypackages__ source/pdm.toml source/.pdm-python
          # --prod: default dependencies only, --prod -G :all: with extras,
          # -G :all: with extras and dev dependency groups
          # enq: string splitting of DEPENDENCY_GROUPS is intentional
          # shellcheck disable=SC2086
          pdm sync --project source --no-self --no-editable --skip=:all ${DEPENDENCY_GROUPS}
          # Built on Linux, assumes the project provides a pure Python wheel
          if [[ "${INSTALL_PROJECT}" == "true" ]]; then
            "$(pdm info --project source --python)" -m pip install --no-deps dist/*.whl
          fi
        # yamllint enable rule:indentation
      - name: "Create SBOM (${{ inputs.type }})"
        env:
          TYPE: "${{ inputs.type }}"
        # enq: working dir is resolved against the project, hence absolute
        run: >
          pdm run --project template --working-dir "${GITHUB_WORKSPACE}/source"
          "sbom-${TYPE}" > "${ARTIFACT}/${ARTIFACT}.json"
      - name: "Scan SBOM"
        uses: "anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2" # v7.4.0
        with:
          sbom: "${{ env.ARTIFACT }}/${{ env.ARTIFACT }}.json"
          fail-build: false
          output-format: "sarif"
          output-file: "${{ env.ARTIFACT }}/grype-${{ env.ARTIFACT }}.sarif"
      - name: "Get digests"
        id: "digests"
        uses: "$/.github/actions/digests"
        with:
          paths: "${{ env.ARTIFACT }}/*"
      - name: "Upload SBOM"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "${{ env.ARTIFACT }}"
          path: "${{ env.ARTIFACT }}"
          retention-days: 1
          if-no-files-found: "error"
          overwrite: true

  # This job exists so security-events token is not available to the SBOM Create
  # as this is an untrusted workflow running pdm sync
  sbom-sarif:
    name: "SBOM SARIF"
    if: >
      inputs.upload-grype
    needs:
      - "sbom-create"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: "Download SBOM"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "${{ env.ARTIFACT }}"
          path: "${{ env.ARTIFACT }}"
      - name: "Verify SBOM and scan"
        uses: "$/.github/actions/digests-verify"
        with:
          digests: "${{ needs.sbom-create.outputs.digests }}"
          names: |
            ${{ env.ARTIFACT }}.json
            grype-${{ env.ARTIFACT }}.sarif
          directory: "${{ env.ARTIFACT }}"
          exact: "true"
      - name: "Upload Grype SARIF"
        uses: "$/.github/actions/sarif-upload"
        with:
          file: "${{ env.ARTIFACT }}/grype-${{ env.ARTIFACT }}.sarif"
          sarif: "true"
          # Without commit SHA, so alerts of fixed findings get closed
          category: "/tool:grype/scope:sbom-${{ inputs.name || inputs.type }}/language:python"

  sbom-attest:
    name: "SBOM Attest"
    # refs other than the released commit are never attested
    if: >
      inputs.digests != ''
      && inputs.ref == ''
      && github.ref_type == 'tag'
      && (vars.NO_GITHUB_ENTERPRISE_CLOUD == '' || github.event.repository.visibility != 'private')
    needs:
      - "sbom-create"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            timestamp.githubapp.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - name: "Get verified distributions"
        uses: "$/.github/actions/dist-download"
        with:
          digests: "${{ inputs.digests }}"
      # Caller supplies the digests, the SBOM is attested only against
      # distributions built by the template for this commit
      - name: "Verify distributions provenance"
        uses: "$/.github/actions/attestation-verify"
        with:
          directory: "dist"
          signers: |
            {"release-build-reusable": ["*"]}
      - name: "Download SBOM"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "${{ env.ARTIFACT }}"
          path: "${{ env.ARTIFACT }}"
      # SBOM job runs untrusted code, which could make it output any subject
      # (e.g. a wheel), hence only the expected names are signed
      - name: "Verify SBOM and scan"
        id: "digests"
        uses: "$/.github/actions/digests-verify"
        with:
          digests: "${{ needs.sbom-create.outputs.digests }}"
          names: |
            ${{ env.ARTIFACT }}.json
            grype-${{ env.ARTIFACT }}.sarif
          directory: "${{ env.ARTIFACT }}"
          exact: "true"
      - name: "Attest SBOM"
        uses: "actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d" # v4.2.1
        with:
          subject-path: "dist/*"
          sbom-path: "${{ env.ARTIFACT }}/${{ env.ARTIFACT }}.json"
      # Release assets (SBOM and its scan) are verified before upload
      - name: "Attest SBOM and scan provenance"
        uses: "actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d" # v4.2.1
        with:
          subject-checksums: "${{ steps.digests.outputs.digests }}"
...
