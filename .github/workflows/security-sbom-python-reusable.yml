---
# enq: reusable workflows offload concurrency limits to the caller
name: "Security SBOM Python Reusable"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      ref:
        description: "The ref to checkout"
        type: "string"
        default: ""
      digests:
        description: >
          sha256sum of the distributions (release build workflow output),
          if given they are installed and the SBOMs attested against them
        type: "string"
        default: ""
      upload-grype:
        description: "Upload the Grype SARIFs to Security tab"
        type: "boolean"
        default: false

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  security-sbom-python:
    name: >
      Security SBOM Python |
      ${{ matrix.tier.name }} |
      python-${{ matrix.python-version }} |
      ${{ matrix.os }}
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        python-version:
          #
          #           DO NOT EDIT UNTIL end marker
          #
          # [[[cog
          # import cog
          # import cogeol
          #
          # for version in reversed(cogeol.scientific()):
          #     cog.outl(f'          - "{version["cycle"]}"')
          # ]]]
          - "3.12"
          - "3.13"
          - "3.14"
          # [[[end]]] (sum: wgdYaRbI0v)
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        # --prod excludes dev groups, so -G :all selects optional groups only
        tier:
          - name: "core"
            groups: "--prod"
          - name: "extras"
            groups: "--prod -G :all"
          - name: "dev"
            groups: "-G :all"
        # core is a subset of extras, its exact SBOM is needed only for releases
        exclude:
          - tier:
              name: "${{ inputs.digests == '' && 'core' || '' }}"
              groups: "--prod"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      contents: "read"
      attestations: "write" # Needed to verify and upload attestation
      id-token: "write" # Needed to get GH Token to attest
      artifact-metadata: "write" # Needed to create artifact metadata
    uses: "$/.github/workflows/sbom-reusable.yml"
    with:
      type: "python"
      # enq: long expression, splitting is unreadable
      # yamllint disable rule:line-length
      name: "python-${{ matrix.tier.name }}-${{ matrix.python-version }}-${{ matrix.os }}"
      # yamllint enable rule:line-length
      groups: "${{ matrix.tier.groups }}"
      os: "${{ matrix.os }}"
      python-version: "${{ matrix.python-version }}"
      ref: "${{ inputs.ref }}"
      digests: "${{ inputs.digests }}"
      upload-grype: "${{ inputs.upload-grype }}"
...
