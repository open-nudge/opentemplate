---
name: "Labeler"

on:
  # enq: can be used as it's a low-risk action with no custom code execution
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - "opened"
      - "edited"
      - "synchronize"
      - "reopened"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    timeout-minutes: 10
    name: "Labeler"
    permissions:
      pull-requests: "write" # Needed to create label
    runs-on: "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        # yamllint enable rule:line-length
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
      - name: "Checkout repository"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        # yamllint enable rule:line-length
        with:
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: "Label PR"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13" # v7.0.0
        # yamllint enable rule:line-length
        with:
          configuration-path: "./.github/label-path.yml"
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
      - name: "PR Labeler"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "github/issue-labeler@c1b0f9f52a63158c4adc09425e858e87b32e9685" # v3.4
        # yamllint enable rule:line-length
        with:
          configuration-path: ".github/label-title.yml"
          enable-versioned-regex: 0
          sync-labels: 1
          include-title: 1
          include-body: 0
...
