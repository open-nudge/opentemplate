---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Security CodeQL"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    outputs:
      digests:
        description: "sha256sum of the SARIF file (named as in the artifact)"
        value: "${{ jobs._security-codeql.outputs.digests }}"
    inputs:
      name:
        description: >
          Name of the artifact and its SARIF file (<name>.sarif),
          default: '' - no artifact upload
        type: "string"
        default: ""
      ref:
        description: "The ref to checkout (default: '' - the triggering ref)"
        type: "string"
        default: ""

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _security-codeql:
    name: "_Security CodeQL"
    # Private repositories without GitHub Code Security opt out by setting
    # NO_GITHUB_CODE_SECURITY variable to any value.
    # Skipped job reports success (required check passes).
    # Visibility checked positively, as schedule payloads may lack it
    if: >
      vars.NO_GITHUB_CODE_SECURITY == ''
      || github.event.repository.visibility == 'public'
      || github.event.repository.visibility == 'internal'
    timeout-minutes: 15
    runs-on: "ubuntu-latest"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "read" # Needed by CodeQL init and analyze (no upload)
      contents: "read"
    outputs:
      digests: "${{ steps.upload.outputs.digests }}"
    env:
      FILE: "${{ inputs.name || 'codeql' }}.sarif"
      # PRs analyze the whole tree (not only the diff), akin to releases
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2" # v2.22.2
        with:
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.ref }}"
          persist-credentials: false
      - name: "Initialize CodeQL"
        uses: "github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee" # v4.39.0
        with:
          languages: "actions"
          build-mode: "none"
          # CLI tied to the pinned action version instead of server-side
          # feature flags, so PR, scheduled and release analyses match
          tools: "linked"
      # Uploaded to the Security tab by the caller (like other tools)
      - name: "Perform CodeQL analysis"
        uses: "github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee" # v4.39.0
        with:
          # Same as the upload category (see _security-upload.yml)
          category: "/tool:codeql/scope:workflows/language:actions"
          upload: "never"
          output: "${{ runner.temp }}/codeql"
      - name: "Rename SARIF file"
        run: >
          mv "${RUNNER_TEMP}/codeql/actions.sarif" "${FILE}"
      # Even on findings, so the caller can upload them to the Security tab
      - name: "Upload files"
        id: "upload"
        if: >
          !cancelled()
        uses: "$/.github/actions/sarif-upload"
        with:
          name: "${{ inputs.name }}"
          file: "${{ env.FILE }}"
      # After the artifact upload, so findings still reach the Security tab
      - name: "Fail on findings"
        run: >
          jq --exit-status '[.runs[].results[]] | length == 0' "${FILE}"
...
