---
name: "GitHub Workflows"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/*.yml"
      - ".github/actions/*/action.yml"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

jobs:
  github-workflows:
    name: "GitHub Workflows"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/github-workflows-reusable.yml"
...
