---
name: "Legal"

on:
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legal:
    name: "Legal"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/legal-reusable.yml"
...
