---
name: "_GitHub"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _github:
    name: "_GitHub"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/_run-check.yml"
    with:
      check: "github"
      sparse-checkout: |
        .github/workflows/*
        .github/actions/*/action.yml
...
