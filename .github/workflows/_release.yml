---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Release"  # zizmor: ignore[concurrency-limits]
on:
  workflow_call:
    inputs:
      upload-sarif:
        description: "Upload SARIFs to the Security tab"
        type: "boolean"
        default: true
    outputs:
      digests:
        description: "sha256sum of the distributions"
        value: "${{ jobs.package-create.outputs.digests }}"
      draft-digests:
        description: "sha256sum of the release draft artifact"
        value: "${{ jobs.github-upload.outputs.digests }}"
      docs-digests:
        description: "sha256sum of the documentation archive"
        value: "${{ jobs.github-upload.outputs.docs-digests }}"
      version:
        description: "Documentation version (vX.Y)"
        value: "${{ jobs.version.outputs.version }}"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

# Release without publishing (release.yml publishes), on non-tag refs
# (release-test.yml) nothing is attested
jobs:
  version:
    name: "Version"
    permissions:
      contents: "read" # Needed to find the latest release on non-tag refs
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    outputs:
      tag: "${{ steps.version.outputs.tag }}"
      version: "${{ steps.version.outputs.version }}"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            api.github.com:443
      - name: "Get release version"
        id: "version"
        # enq: globalize.sh expands this to repository path and commit SHA
        # yamllint disable-line rule:line-length
        uses: "$/.github/actions/release-version"

  sboms:
    name: "SBOMs"
    needs:
      - "package-create"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to security tab
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
      contents: "read"
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_release-sboms.yml"
    with:
      upload-sarif: "${{ inputs.upload-sarif }}"
      digests: "${{ needs.package-create.outputs.digests }}"

  sarifs:
    name: "SARIFs"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to security tab
      contents: "read" # Needed by the scanners to checkout repository
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_release-sarifs.yml"
    with:
      upload-sarif: "${{ inputs.upload-sarif }}"

  tests:
    name: "Tests"
    permissions:
      contents: "read"
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_tests.yml"

  docs:
    name: "Docs"
    needs:
      - "version"
    permissions:
      contents: "read"
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_release-docs.yml"
    with:
      version: "${{ needs.version.outputs.version }}"

  # Works regardless of repo type
  package-create:
    name: "Package Create"
    permissions:
      contents: "read"
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_release-build.yml"

  changelog:
    name: "Changelog"
    needs:
      - "sboms"
      - "sarifs"
      - "tests"
      - "docs"
      - "package-create"
    permissions:
      contents: "read"
      pull-requests: "read" # Needed to read PR metadata during changelog gen
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_release-changelog.yml"
    with:
      package-name: "${{ needs.package-create.outputs.package-name }}"
      package-version: "${{ needs.package-create.outputs.package-version }}"

  vsa:
    name: "VSA"
    needs:
      - "package-create"
    permissions:
      contents: "read"
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to verify and upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_release-vsa.yml"
    with:
      digests: "${{ needs.package-create.outputs.digests }}"
      package-name: "${{ needs.package-create.outputs.package-name }}"
      package-version: "${{ needs.package-create.outputs.package-version }}"

  github-upload:
    name: "GitHub Upload"
    # vsa: its attestation is bundled with the distributions
    needs:
      - "changelog"
      - "package-create"
      - "version"
      - "vsa"
    permissions:
      contents: "read"
      attestations: "read" # Needed to verify release assets
    # enq: globalize.sh expands this to repository path and commit SHA
    # yamllint disable-line rule:line-length
    uses: "$/.github/workflows/_release-upload.yml"
    with:
      digests: "${{ needs.package-create.outputs.digests }}"
      tag: "${{ needs.version.outputs.tag }}"
      version: "${{ needs.version.outputs.version }}"

...
