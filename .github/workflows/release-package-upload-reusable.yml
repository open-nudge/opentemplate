---
# enq: reusable workflows offload concurrency limits to the caller
name: "Release Package Upload"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    outputs:
      package-version:
        description: "The normalized package version."
        value: "${{ jobs.release-package-upload.outputs.package-version }}"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  release-package-upload:
    name: "Release Package Upload"
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    outputs:
      package-version: "${{ steps.finalize.outputs.package-version }}"

    steps:
      - name: "Harden Runner"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450" # v2.19.1
        # yamllint enable rule:line-length
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >+
      - name: "Download artifacts"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        # yamllint enable rule:line-length
        with:
          name: "dist-${{ github.sha }}"
      - name: "Finalize artifacts"
        id: "finalize"
        shell: "bash"
        # enq: complex script, indentation rules would make it unreadable
        # yamllint disable rule:indentation rule:line-length
        run: |
          mkdir -p "release-dist"
          shopt -s nullglob

          sdists=(*.tar.gz)
          wheels=(*.whl)

          if (( ${#sdists[@]} != 1 )); then
            echo "::error title=Invalid source distribution artifacts::Expected exactly one *.tar.gz file, found ${#sdists[@]}."
            exit 1
          fi

          sdist_name=${sdists[0]##*/}
          if [[ ! "${sdist_name}" =~ ^([a-z0-9]+(-[a-z0-9]+)*)-([0-9][a-z0-9.!+]*)\.tar\.gz$ ]]; then
            echo "::error title=Invalid source distribution filename::Expected a standardized {name}-{version}.tar.gz filename, got ${sdist_name}."
            exit 1
          fi

          package_version=${BASH_REMATCH[3]}
          echo "package-version=${package_version}" >> "${GITHUB_OUTPUT}"

          distributions=("${sdists[@]}" "${wheels[@]}")

          for distribution in "${distributions[@]}"; do
            base=${distribution##*/}

            if [[ "${base}" != *-* ]]; then
              echo "::error title=Invalid distribution filename::Expected a hyphen in ${base}."
              exit 1
            fi

            prefix=${base%%-*}
            suffix=${base#"${prefix}"}

            mv -- \
              "${distribution}" \
              "release-dist/${prefix}-${GITHUB_SHA}${suffix}"
          done
        # yamllint enable rule:indentation rule:line-length
      - name: "Upload artifacts"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        # yamllint enable rule:line-length
        with:
          name: "dist-${{ github.sha }}"
          path: "release-dist"
          retention-days: 1
          overwrite: true
          if-no-files-found: "error"
...
