---
# enq: reusable workflows offload concurrency limits to the caller
name: "_Security uv audit"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    outputs:
      digests:
        description: "sha256sum of the SARIF file (named as in the artifact)"
        value: "${{ jobs._security-uv-audit.outputs.digests }}"
    inputs:
      name:
        description: >
          Name of the artifact and its SARIF file (<name>.sarif),
          default: '' - no artifact upload
        type: "string"
        default: ""
      ref:
        description: "The ref to checkout (default: '' - the triggering ref)"
        type: "string"
        default: ""
      continue-on-error:
        description: "Whether to continue on error"
        type: "boolean"
        default: false

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

defaults:
  run:
    shell: "bash"

jobs:
  _security-uv-audit:
    name: "_Security uv audit"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: "read"
    outputs:
      digests: "${{ steps.upload.outputs.digests }}"
    env:
      FILE: "${{ inputs.name || 'uv-audit' }}.sarif"
    steps:

      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            api.osv.dev:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: "Checkout source"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.ref }}"
          path: "source"
          persist-credentials: false
      # Hash-locked uv from the template, the caller cannot alter it
      - name: "Setup uv"
        uses: "$/.github/actions/setup-release"
        with:
          group: "dev-bootstrap"
      # Ignores are read from [tool.uv.audit] of the source project
      - name: "Run audit"
        continue-on-error: "${{ inputs.continue-on-error }}"
        run: >
          uv audit --project source --frozen --preview-features audit-command
          --output-format sarif > "${FILE}"
      - name: "Upload files"
        id: "upload"
        if: >
          !cancelled()
        uses: "$/.github/actions/sarif-upload"
        with:
          name: "${{ inputs.name }}"
          file: "${{ env.FILE }}"
...
