---
name: "Security GuardDog"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "pyproject.toml"
      - "pdm.lock"
      - ".github/workflows/**"
  merge_group:
    types:
      - "checks_requested"
  push:
    branches:
      - "main"
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core is a subset of extras, its exact SARIF is needed only for releases,
  # dev dependencies are not scanned as it takes too long.
  security-guarddog-python:
    permissions:
      contents: "read"
    name: "Security GuardDog Python"
    uses: "$/.github/workflows/security-guarddog-reusable.yml"
    with:
      target: "python"
      groups: "--prod -G :all"
      name: "guarddog-extras"

  security-guarddog-actions:
    permissions:
      contents: "read"
    name: "Security GuardDog Actions"
    uses: "$/.github/workflows/security-guarddog-reusable.yml"
    with:
      target: "actions"
      name: "guarddog-actions"

  # Separate job, so PRs (which do not upload) run without write permissions
  security-guarddog-upload:
    name: "Security GuardDog Upload (${{ matrix.scan.name }})"
    needs:
      - "security-guarddog-python"
      - "security-guarddog-actions"
    # Also on failure, so findings reach the Security tab
    if: >
      !cancelled()
      && github.event_name != 'pull_request'
      && github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        scan:
          - name: "guarddog-extras"
            category: "/tool:guarddog/scope:dependencies-extras/language:python"
          - name: "guarddog-actions"
            category: "/tool:guarddog/scope:actions/language:actions"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
    uses: "$/.github/workflows/security-upload-reusable.yml"
    with:
      name: "${{ matrix.scan.name }}"
      category: "${{ matrix.scan.category }}"
...
