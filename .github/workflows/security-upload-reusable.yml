---
# enq: reusable workflows offload concurrency limits to the caller
name: "Security Upload Reusable"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      name:
        description: >
          Name of the artifact containing the SARIF file (<name>.sarif)
        type: "string"
        required: true
      category:
        description: >
          Code scanning category, /tool:<tool>/scope:<scope>/language:<language>
          (see docs/template/details/security.md)
        type: "string"
        required: true
      ref:
        description: >
          Full Git reference the SARIF belongs to, e.g. refs/tags/<tag>
          (default: '' - the triggering ref), set together with sha
        type: "string"
        default: ""
      sha:
        description: >
          Commit SHA the SARIF belongs to
          (default: '' - the triggering commit), set together with ref
        type: "string"
        default: ""

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  # Separate from the scanners, so these (and PRs) run without write permissions
  security-upload-reusable:
    name: "Security Upload Reusable"
    # Without GitHub Code Security (see security-codeql-reusable.yml)
    # there is no Security tab, findings are in the scanner job summary.
    # Skipped job reports success
    if: >
      vars.NO_GITHUB_CODE_SECURITY == ''
      || github.event.repository.visibility == 'public'
      || github.event.repository.visibility == 'internal'
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      # No checkout, the template actions are referenced remotely
      - name: "Download SARIF file"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "${{ inputs.name }}"
      - name: "Upload SARIF file"
        uses: "$/.github/actions/sarif-upload"
        with:
          file: "${{ inputs.name }}.sarif"
          sarif: "true"
          category: "${{ inputs.category }}"
          ref: "${{ inputs.ref }}"
          sha: "${{ inputs.sha }}"
...
