---
name: "Security uv audit"

on:
  pull_request:
    branches:
      - "main"
  merge_group:
    types:
      - "checks_requested"
  push:
    branches:
      - "main"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

# Weekly rescans of main and the latest release: security-sarifs-update.yml
jobs:
  security-uv-audit:
    permissions:
      contents: "read"
    name: "Security uv audit"
    uses: "$/.github/workflows/_security-uv-audit.yml"
    with:
      name: "uv-audit"

  # Separate job, so PRs (which do not upload) run without write permissions
  security-uv-audit-upload:
    name: "Security uv audit Upload"
    needs: "security-uv-audit"
    # Also on failure, so findings reach the Security tab
    if: >
      !cancelled()
      && github.event_name != 'pull_request'
      && github.event_name != 'merge_group'
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
    uses: "$/.github/workflows/_security-upload.yml"
    with:
      name: "uv-audit"
      category: "/tool:uv-audit/scope:dependencies/language:python"
...
