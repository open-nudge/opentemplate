---
# enq: reusable workflows offload concurrency limits to the caller
name: "Security Semgrep Reusable"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      name:
        description: "Name of the artifact (default: '' - no artifact upload)"
        type: "string"
        default: ""
      sarif:
        description: "Upload SARIF file to CodeQL"
        type: "boolean"
        default: false
      continue-on-error:
        description: "Whether to continue on error"
        type: "boolean"
        default: false
      file:
        description: "Name/path of the created SARIF file"
        type: "string"
        default: "semgrep.sarif"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  security-semgrep-reusable:
    name: "Security Semgrep Reusable"
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to to upload SARIF file to tab
      contents: "read"
    steps:
      - name: "Harden Runner"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450" # v2.19.1
        # yamllint enable rule:line-length
        with:
          # Container support is required for the Semgrep action.
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            github.com:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            semgrep.dev:443
      - name: "Checkout repository"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: "Run Semgrep"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        uses: "docker://semgrep/semgrep:1.174.0@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade"
        # yamllint enable rule:line-length
        # Keep these arguments aligned with the hook scan in prek.toml.
        with:
          entrypoint: "semgrep"
          args: >-
            scan
            --experimental
            --exclude=*pdm.lock
            --config=p/python
            --config=p/secrets
            --config=p/security-audit
            --config=p/ci
            --config=p/github-actions
            --config=p/bandit
            --config=p/gitleaks
            --config=p/trailofbits
            --error
            --metrics=off
            --severity=INFO
            --strict
            --sarif-output="${{ inputs.file }}"
            .
      - name: "Upload files"
        # enq: hash with name and version always longer than 80 chars
        # yamllint disable rule:line-length
        # enq: unpinned as it allows projects to use the latest
        uses: "open-nudge/opentemplate/.github/actions/sarif-upload@main" # zizmor: ignore[unpinned-uses]
        # yamllint enable rule:line-length
        with:
          name: "${{ inputs.name }}"
          file: "${{ inputs.file }}"
          sarif: "${{ inputs.sarif }}"
...
