---
# enq: reusable workflows offload concurrency limits to the caller
name: "Security Semgrep Reusable"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    outputs:
      digests:
        description: "sha256sum of the SARIF file (named as in the artifact)"
        value: "${{ jobs.security-semgrep-reusable.outputs.digests }}"
    inputs:
      name:
        description: >
          Name of the artifact and its SARIF file (<name>.sarif),
          default: '' - no artifact upload
        type: "string"
        default: ""
      ref:
        description: "The ref to checkout (default: '' - the triggering ref)"
        type: "string"
        default: ""

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  security-semgrep-reusable:
    name: "Security Semgrep Reusable"
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    outputs:
      digests: "${{ steps.upload.outputs.digests }}"
    env:
      FILE: "${{ inputs.name || 'semgrep' }}.sarif"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          # Container support is required for the Semgrep action.
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            github.com:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            semgrep.dev:443
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.ref }}"
          persist-credentials: false

      - name: "Run Semgrep"
        # enq: the image reference is digest-pinned.
        # yamllint disable rule:line-length
        uses: "docker://semgrep/semgrep:1.177.0@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0"
        # yamllint enable rule:line-length
        # Keep these arguments aligned with the hook scan in prek.toml.
        with:
          entrypoint: "semgrep"
          args: >-
            scan
            --exclude=*pdm.lock
            --config=p/python
            --config=p/secrets
            --config=p/security-audit
            --config=p/ci
            --config=p/github-actions
            --config=p/bandit
            --config=p/gitleaks
            --config=p/trailofbits
            --error
            --metrics=off
            --severity=INFO
            --strict
            --sarif-output="${{ env.FILE }}"
            .
      - name: "Upload files"
        id: "upload"
        if: >
          !cancelled()
        uses: "$/.github/actions/sarif-upload"
        with:
          name: "${{ inputs.name }}"
          file: "${{ env.FILE }}"
...
