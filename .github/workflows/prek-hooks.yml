---
name: "prek Hooks"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/actions/uv-setup/action.yml"
      - ".prek-hooks.yaml"
      - ".github/workflows/prek-hooks.yml"
      - ".github/workflows/_run-check.yml"
      - ".github/workflows/__run.yml"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: "prek"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/_run-check.yml"
    with:
      check: "prek-hooks"
      group: "prek"
      sparse-checkout: |
        .prek-hooks.yaml
...
