---
#
# enq: reusable workflows offload concurrency limits to the caller
name: "_SBOM"  # zizmor: ignore[concurrency-limits]

on:
  workflow_call:
    inputs:
      type:
        description: "Type of SBOM to create, runs sbom-<type> poe task"
        type: "string"
        required: true
      name:
        description: "Name of the SBOM artifact (defaults to type)"
        type: "string"
        default: ""
      groups:
        description: "Dependency groups (uv sync flags) of the assessed env"
        type: "string"
        default: ""
      os:
        description: "Operating system to run on"
        type: "string"
        default: "ubuntu-latest"
      python-version:
        description: "Python version used to create the SBOM"
        type: "string"
        #
        #           DO NOT EDIT UNTIL end marker
        #
        # [[[cog
        # import cog
        # import cogeol
        #
        # cycle = cogeol.scientific()[-1]["cycle"]
        # cog.out(f'        default: "{cycle}"')
        # ]]]
        default: "3.13"
        # [[[end]]] (sum: SI+mdccfl+)
      ref:
        description: "The ref to checkout"
        type: "string"
        default: ""
      tag:
        description: >
          Release tag the SARIFs are uploaded under, set together with ref
          (default: '' - the triggering ref)
        type: "string"
        default: ""
      digests:
        description: >
          sha256sum of the distributions (release build workflow output),
          if given they are installed into the assessed environment
          and the SBOM is attested against them
        type: "string"
        default: ""
      licenses:
        description: >
          Check licenses of the assessed environment (groups) with Trivy,
          configurable using .trivy.yaml of the repository
        type: "boolean"
        default: false
      trivy-version:
        description: >
          Trivy release to scan with (required for python type or licenses),
          resolved by the caller as the newest release older than 7 days
        type: "string"
        default: ""
      upload-sarif:
        description: "Upload the Trivy SARIFs to Security tab"
        type: "boolean"
        default: false

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

defaults:
  run:
    shell: "bash"

env:
  ARTIFACT: "sbom-${{ inputs.name || inputs.type }}-${{ inputs.tag || github.sha }}"
  # Only Python SBOMs are scanned for vulnerabilities, Trivy (like Grype)
  # does not match GitHub Actions (zizmor does) and the legal SBOM lists files
  SCAN: "${{ inputs.type == 'python' }}"
  # Trivy configuration of the scans, attested and released with them
  # (same names for every SBOM of a commit, hence a single release asset)
  SCAN_CONFIG: "trivy-config-${{ inputs.tag || github.sha }}.yaml"
  SCAN_IGNORES: "trivy-ignore-${{ inputs.tag || github.sha }}.yaml"

jobs:
  sbom-create:
    name: "SBOM Create"
    runs-on: "${{ inputs.os }}"
    timeout-minutes: 30
    permissions:
      contents: "read"
    outputs:
      digests: "${{ steps.digests.outputs.digests }}"
    env:
      # Only an assessed environment (groups) contains the distributions
      INSTALL_PROJECT: "${{ inputs.digests != '' && inputs.groups != '' }}"
      # Template workflows and actions are part of the release process
      SBOM_ACTIONS_EXTRA: "${{ github.workspace }}/template/.github"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          # Windows curl (Schannel) fetches CRLs over HTTP to install Trivy,
          # entries space separated, Windows agent drops ones after a newline
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            get.trivy.dev:443
            github.com:443
            ghcr.io:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            ${{ runner.os == 'Windows'
            && '*.c.lencr.org:80 c.pki.goog:80 crl.sectigo.com:80 ocsp.sectigo.com:80'
            || '' }}
      # Fails early, an empty version would install the latest Trivy release
      - name: "Check Trivy version"
        if: >
          (env.SCAN == 'true' || inputs.licenses) && inputs.trivy-version == ''
        run: >
          echo "::error::trivy-version input is required to scan with Trivy" && exit 1
      - name: "Checkout source"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.ref }}"
          path: "source"
          persist-credentials: false
      # SBOM timestamps are derived from the source commit time
      - name: "Setup reproducibility"
        uses: "$/.github/actions/reproducibility-setup"
        with:
          path: "source"
      - name: "Setup template release tools"
        uses: "$/.github/actions/setup-release"
        with:
          python-version: "${{ inputs.python-version }}"
          sparse-checkout: >-
            ${{ inputs.type == 'actions' && '/.github/' || '' }}
      # Only releases have distributions
      - name: "Get verified distributions"
        if: >
          env.INSTALL_PROJECT == 'true'
        uses: "$/.github/actions/dist-download"
        with:
          digests: "${{ inputs.digests }}"
      # Identity is part of the legal SBOM
      - name: "Setup git identity"
        uses: "$/.github/actions/git-setup"
      - name: "Create directory for SBOM"
        run: >
          mkdir "${ARTIFACT}"
      # Trivy configuration is project specific (allowed licenses, ignores),
      # scans use the copies, the template provides both files (none optional)
      - name: "Copy Trivy configuration"
        if: >
          env.SCAN == 'true'
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation
        run: |
          cp source/.trivy.yaml "${ARTIFACT}/${SCAN_CONFIG}"
          cp source/.trivyignore.yaml "${ARTIFACT}/${SCAN_IGNORES}"
        # yamllint enable rule:indentation
      - name: "Install assessed environment"
        if: >
          inputs.groups != ''
        env:
          DEPENDENCY_GROUPS: "${{ inputs.groups }}"
          PYTHON_VERSION: "${{ inputs.python-version }}"
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation
        run: |
          # --no-default-groups: default dependencies only,
          # --no-default-groups --all-extras: with extras,
          # --all-extras --all-groups: with extras and dev dependency groups
          # enq: string splitting of DEPENDENCY_GROUPS is intentional
          # shellcheck disable=SC2086
          uv sync --project source --locked --python "${PYTHON_VERSION}" \
            --no-install-project --no-editable ${DEPENDENCY_GROUPS}
          # Built on Linux, assumes the project provides a pure Python wheel
          if [[ "${INSTALL_PROJECT}" == "true" ]]; then
            uv pip install --python source/.venv --no-deps dist/*.whl
          fi
        # yamllint enable rule:indentation
      - name: "Create SBOM (${{ inputs.type }})"
        env:
          TYPE: "${{ inputs.type }}"
        # Template tasks assess the source project (current directory)
        working-directory: "source"
        run: >
          uv run --project ../template poe --directory ../template
          "sbom-${TYPE}" > "../${ARTIFACT}/${ARTIFACT}.json"
      # The version used is recorded in the SARIFs (tool.driver.version)
      - name: "Setup Trivy"
        if: >
          env.SCAN == 'true' || inputs.licenses
        uses: "aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567" # v0.3.1
        with:
          # enq: resolved by the caller to an exact release with a 7-day cooldown
          version: "${{ inputs.trivy-version }}" # zizmor: ignore[unpinned-tools]
          cache: "false"
      # Vulnerabilities are triaged in the Security tab instead of failing the job
      - name: "Scan SBOM vulnerabilities"
        if: >
          env.SCAN == 'true'
        run: >
          trivy sbom --skip-version-check
          --config "${ARTIFACT}/${SCAN_CONFIG}"
          --ignorefile "${ARTIFACT}/${SCAN_IGNORES}"
          --scanners vuln
          --format sarif --output "${ARTIFACT}/trivy-vuln-${ARTIFACT}.sarif"
          "${ARTIFACT}/${ARTIFACT}.json"
      # Installed environment, as Trivy maps license classifiers of installed
      # packages (not of the SBOM) to SPDX identifiers
      - name: "Scan environment licenses"
        if: >
          inputs.licenses
        run: >
          trivy rootfs --skip-version-check
          --config "${ARTIFACT}/${SCAN_CONFIG}"
          --ignorefile "${ARTIFACT}/${SCAN_IGNORES}"
          --scanners license --severity UNKNOWN,MEDIUM,HIGH,CRITICAL
          --format sarif --output "${ARTIFACT}/trivy-licenses-${ARTIFACT}.sarif"
          source/.venv
      # Read-only, digests and artifact are unaffected
      - name: "Summarize SBOM vulnerabilities"
        if: >
          env.SCAN == 'true'
        uses: "$/.github/actions/sarif-summary"
        with:
          file: "${{ env.ARTIFACT }}/trivy-vuln-${{ env.ARTIFACT }}.sarif"
      - name: "Summarize environment licenses"
        if: >
          inputs.licenses
        uses: "$/.github/actions/sarif-summary"
        with:
          file: "${{ env.ARTIFACT }}/trivy-licenses-${{ env.ARTIFACT }}.sarif"
      - name: "Get digests"
        id: "digests"
        uses: "$/.github/actions/digests"
        with:
          paths: "${{ env.ARTIFACT }}/*"
      - name: "Upload SBOM"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "${{ env.ARTIFACT }}"
          path: "${{ env.ARTIFACT }}"
          retention-days: 1
          if-no-files-found: "error"
          overwrite: true
      # Last, so the SBOM and its scans are uploaded regardless,
      # licenses not allowed by .trivy.yaml fail the job (and the release)
      - name: "Check environment licenses"
        if: >
          inputs.licenses
        run: >
          trivy rootfs --skip-version-check
          --config "${ARTIFACT}/${SCAN_CONFIG}"
          --ignorefile "${ARTIFACT}/${SCAN_IGNORES}"
          --scanners license --severity UNKNOWN,MEDIUM,HIGH,CRITICAL
          --exit-code 1
          source/.venv

  # This job exists so security-events token is not available to the SBOM Create
  # as this is an untrusted workflow running uv sync
  sbom-sarif:
    name: "SBOM SARIF"
    # Without GitHub Code Security (see _security-codeql.yml)
    # there is no Security tab to upload to.
    # enq: complex expression more readable with indentation
    # yamllint disable-line rule:indentation
    if: >
      !cancelled()
      && needs.sbom-create.outputs.digests != ''
      && inputs.upload-sarif
      && inputs.type == 'python'
      && (
        vars.NO_GITHUB_CODE_SECURITY == ''
        || github.event.repository.visibility == 'public'
        || github.event.repository.visibility == 'internal'
      )
    needs:
      - "sbom-create"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: "Download SBOM"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "${{ env.ARTIFACT }}"
          path: "${{ env.ARTIFACT }}"
      - name: "Verify SBOM and scan"
        uses: "$/.github/actions/digests-verify"
        with:
          digests: "${{ needs.sbom-create.outputs.digests }}"
          # enq: long expressions, splitting is unreadable
          # yamllint disable rule:line-length
          names: |
            ${{ env.ARTIFACT }}.json
            ${{ env.SCAN == 'true' && format('trivy-vuln-{0}.sarif', env.ARTIFACT) || '' }}
            ${{ inputs.licenses && format('trivy-licenses-{0}.sarif', env.ARTIFACT) || '' }}
            ${{ env.SCAN == 'true' && env.SCAN_CONFIG || '' }}
            ${{ env.SCAN == 'true' && env.SCAN_IGNORES || '' }}
          # yamllint enable rule:line-length
          directory: "${{ env.ARTIFACT }}"
          exact: "true"
      - name: "Upload Trivy vulnerabilities SARIF"
        uses: "$/.github/actions/sarif-upload"
        with:
          file: "${{ env.ARTIFACT }}/trivy-vuln-${{ env.ARTIFACT }}.sarif"
          sarif: "true"
          # Without commit SHA, so alerts of fixed findings get closed
          category: "/tool:trivy/scope:sbom-${{ inputs.name || inputs.type }}/language:python"
          ref: "${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}"
          sha: "${{ inputs.tag && inputs.ref || '' }}"
      - name: "Upload Trivy licenses SARIF"
        if: >
          inputs.licenses
        uses: "$/.github/actions/sarif-upload"
        with:
          file: "${{ env.ARTIFACT }}/trivy-licenses-${{ env.ARTIFACT }}.sarif"
          sarif: "true"
          category: "/tool:trivy/scope:licenses-${{ inputs.name || inputs.type }}/language:python"
          ref: "${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}"
          sha: "${{ inputs.tag && inputs.ref || '' }}"

  sbom-attest:
    name: "SBOM Attest"
    # refs other than the released commit are never attested
    if: >
      inputs.digests != ''
      && inputs.ref == ''
      && github.ref_type == 'tag'
      && (vars.NO_GITHUB_ENTERPRISE_CLOUD == '' || github.event.repository.visibility != 'private')
    needs:
      - "sbom-create"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            timestamp.githubapp.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - name: "Get verified distributions"
        uses: "$/.github/actions/dist-download"
        with:
          digests: "${{ inputs.digests }}"
      # Caller supplies the digests, the SBOM is attested only against
      # distributions built by the template for this commit
      - name: "Verify distributions provenance"
        uses: "$/.github/actions/attestation-verify"
        with:
          directory: "dist"
          signers: |
            {"_release-build": ["*"]}
      - name: "Download SBOM"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "${{ env.ARTIFACT }}"
          path: "${{ env.ARTIFACT }}"
      # SBOM job runs untrusted code, which could make it output any subject
      # (e.g. a wheel), hence only the expected names are signed
      - name: "Verify SBOM and scan"
        id: "digests"
        uses: "$/.github/actions/digests-verify"
        with:
          digests: "${{ needs.sbom-create.outputs.digests }}"
          # enq: long expressions, splitting is unreadable
          # yamllint disable rule:line-length
          names: |
            ${{ env.ARTIFACT }}.json
            ${{ env.SCAN == 'true' && format('trivy-vuln-{0}.sarif', env.ARTIFACT) || '' }}
            ${{ inputs.licenses && format('trivy-licenses-{0}.sarif', env.ARTIFACT) || '' }}
            ${{ env.SCAN == 'true' && env.SCAN_CONFIG || '' }}
            ${{ env.SCAN == 'true' && env.SCAN_IGNORES || '' }}
          # yamllint enable rule:line-length
          directory: "${{ env.ARTIFACT }}"
          exact: "true"
      # Not sbom-path, it requires serialNumber, which reproducible CycloneDX
      # SBOMs omit, predicate types are the ones sbom-path would set
      # (SPDX version of sbom-legal in pyproject.toml)
      - name: "Attest SBOM"
        uses: "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
        with:
          subject-path: "dist/*"
          predicate-type: >-
            ${{ inputs.type == 'legal'
            && 'https://spdx.dev/Document/v2.2'
            || 'https://cyclonedx.org/bom' }}
          predicate-path: "${{ env.ARTIFACT }}/${{ env.ARTIFACT }}.json"
      # Release assets (SBOM and its scan) are verified before upload
      - name: "Attest SBOM and scan provenance"
        uses: "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
        with:
          subject-checksums: "${{ steps.digests.outputs.digests }}"
...
