---
name: "_Commit"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _commit:
    name: "_Commit"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/_run-check.yml"
    with:
      check: "commit"
      arguments: >-
        <(git log -1 --format=%s)
      ref: "${{ github.event.pull_request.head.sha }}"
...
