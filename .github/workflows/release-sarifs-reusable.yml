---
name: "Release SARIFs Reusable"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  ###############################################################################
  #
  #                             SECURITY JOBS
  #
  ###############################################################################
  sarif-osv-scanner:
    permissions:
      contents: "read"
    name: "Sarif OSV-Scanner"
    uses: "$/.github/workflows/security-osv-scanner-reusable.yml"
    with:
      name: "osv-scanner-${{ github.sha }}"

  sarif-semgrep:
    permissions:
      contents: "read"
    name: "Sarif Semgrep"
    uses: "$/.github/workflows/security-semgrep-reusable.yml"
    with:
      name: "semgrep-${{ github.sha }}"

  sarif-codeql:
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "read" # Needed by CodeQL init and analyze (no upload)
      contents: "read"
    name: "Sarif CodeQL"
    uses: "$/.github/workflows/security-codeql-reusable.yml"
    with:
      name: "codeql-${{ github.sha }}"

  ###############################################################################
  #
  #                             UPLOAD JOBS
  #
  ###############################################################################
  # Also on failure (findings), so these reach the Security tab,
  # categories shared with security-*.yml (one analysis per tool)
  # Scan jobs cannot be a matrix (uses must be static, matrix outputs
  # overwrite each other and sarif-attest needs digests of each tool)
  sarif-upload:
    name: "Sarif Upload (${{ matrix.tool.name }})"
    needs:
      - "sarif-osv-scanner"
      - "sarif-semgrep"
      - "sarif-codeql"
    if: >
      !cancelled()
    strategy:
      # Each tool's findings reach the Security tab independently
      fail-fast: false
      matrix:
        tool:
          - name: "osv-scanner"
            category: "/tool:osv-scanner/scope:dependencies/language:python"
            skip: false
          - name: "semgrep"
            category: "/tool:semgrep/scope:repository/language:all"
            skip: false
          # Digests are empty if CodeQL was skipped (see security-codeql-reusable.yml)
          - name: "codeql"
            category: "/tool:codeql/scope:workflows/language:actions"
            skip: "${{ needs.sarif-codeql.outputs.digests == '' }}"
        exclude:
          - tool:
              skip: true
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
    uses: "$/.github/workflows/security-upload-reusable.yml"
    with:
      name: "${{ matrix.tool.name }}-${{ github.sha }}"
      category: "${{ matrix.tool.category }}"

  sarif-attest:
    name: "Sarif Attest"
    # CodeQL may be skipped (NO_GITHUB_CODE_SECURITY variable), other SARIFs are still attested
    if: >
      !cancelled() && !failure()
      && github.event_name == 'release'
      && (vars.NO_GITHUB_ENTERPRISE_CLOUD == '' || github.event.repository.visibility != 'private')
    needs:
      - "sarif-osv-scanner"
      - "sarif-semgrep"
      - "sarif-codeql"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      id-token: "write" # Needed to get GH Token to attest
      attestations: "write" # Needed to upload attestation
      artifact-metadata: "write" # Needed to create artifact metadata
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.githubapp.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            timestamp.githubapp.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      # Digests come from the scan jobs, the artifacts might be replaced
      - name: "Attest SARIFs provenance"
        uses: "actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d" # v4.2.1
        with:
          # Literal block: each digest must stay on its own line
          subject-checksums: |
            ${{ needs.sarif-osv-scanner.outputs.digests }}
            ${{ needs.sarif-semgrep.outputs.digests }}
            ${{ needs.sarif-codeql.outputs.digests }}
...
