---
name: "_JSON5"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  _json5:
    name: "_JSON5"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/_run-check.yml"
    with:
      check: "json5"
      arguments: "$(find -path '*.json5')"
      group: "json5"
      sparse-checkout: |
        prek.toml
        **.json5
...
