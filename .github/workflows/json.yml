---
name: "JSON"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "**.json"
      - ".github/actions/pdm-*/action.yml"
      - ".github/workflows/json.yml"
      - ".github/workflows/_json.yml"
      - ".github/workflows/_run-check.yml"
      - ".github/workflows/__run.yml"
  merge_group:
    types:
      - "checks_requested"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

cache-mode: "read"

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json:
    name: "JSON"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/_json.yml"
...
