---
name: "JSON Reusable"

on:
  workflow_call:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

jobs:
  json-reusable:
    name: "JSON Reusable"
    permissions:
      contents: "read"
    uses: "$/.github/workflows/run-check-reusable.yml"
    with:
      check: "json"
      arguments: "$(find -path '*.json')"
      group: "json"
      sparse-checkout: |
        prek.toml
        **.json
...
