---
name: "SARIF Upload"
description: >
  Upload a SARIF file as an artifact (outputting its digests, to be signed
  by an attestation job of the calling workflow) and summarize its findings
  in the job summary, or upload it to GitHub code scanning

inputs:
  file:
    description: >
      Path to the SARIF file
    default: ""
  name:
    description: >
      Name of the artifact (default: '' - no artifact upload)
    default: ""
  sarif:
    description: >
      Whether to upload the file to GitHub code scanning
    default: "false"
  category:
    description: >
      Code scanning category, distinguishes uploads of the same tool
      (default: '' - derived from the workflow and job)
    default: ""
  ref:
    description: >
      Full Git reference the SARIF belongs to, e.g. refs/tags/<tag>
      (default: '' - the triggering ref), set together with sha
    default: ""
  sha:
    description: >
      Commit SHA the SARIF belongs to
      (default: '' - the triggering commit), set together with ref
    default: ""

outputs:
  digests:
    description: >
      sha256sum of the file (basename, as stored in the artifact),
      empty if no artifact is uploaded
    value: "${{ steps.digests.outputs.digests }}"

runs:
  using: "composite"
  steps:
    - name: "Upload artifact"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      if: >
        inputs.name != ''
      with:
        name: "${{ inputs.name }}"
        path: "${{ inputs.file }}"
        retention-days: 7
        overwrite: true
    - name: "Get digests"
      id: "digests"
      if: >
        inputs.name != ''
      uses: "$/.github/actions/digests"
      with:
        paths: "${{ inputs.file }}"
    # In the scanner job only (not in the Security tab upload),
    # findings are visible without GitHub Code Security
    - name: "Summarize findings"
      if: >
        inputs.sarif != 'true'
      uses: "$/.github/actions/sarif-summary"
      with:
        file: "${{ inputs.file }}"
    - name: "Upload SARIF file to GitHub Advanced Security Dashboard"
      if: >
        inputs.sarif == 'true'
      # SARIF upload may fail if there is no integration enabled
      continue-on-error: true
      uses: "github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee" # v4.39.0
      with:
        sarif_file: "${{ inputs.file }}"
        category: "${{ inputs.category }}"
        ref: "${{ inputs.ref }}"
        sha: "${{ inputs.sha }}"
...
