---
name: "SARIF Upload"
description: >
  Upload a SARIF file as an artifact (outputting its digests, to be signed
  by an attestation job of the calling workflow) and/or to GitHub code scanning

inputs:
  file:
    description: >
      Path to the SARIF file
    default: ""
  name:
    description: >
      Name of the artifact (default: '' - no artifact upload)
    default: ""
  sarif:
    description: >
      Whether to upload the file to GitHub code scanning
    default: "false"
  category:
    description: >
      Code scanning category, distinguishes uploads of the same tool
      (default: '' - derived from the workflow and job)
    default: ""

outputs:
  digests:
    description: >
      sha256sum of the file (basename, as stored in the artifact),
      empty if no artifact is uploaded
    value: "${{ steps.digests.outputs.digests }}"

runs:
  using: "composite"
  steps:
    - name: "Upload artifact"
      uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
      if: >
        inputs.name != ''
      with:
        name: "${{ inputs.name }}"
        path: "${{ inputs.file }}"
        retention-days: 7
        overwrite: true
    - name: "Get digests"
      id: "digests"
      if: >
        inputs.name != ''
      uses: "$/.github/actions/digests"
      with:
        paths: "${{ inputs.file }}"
    - name: "Upload SARIF file to GitHub Advanced Security Dashboard"
      if: >
        inputs.sarif == 'true'
      # SARIF upload may fail if there is no integration enabled
      continue-on-error: true
      uses: "github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd" # v4.38.1
      with:
        sarif_file: "${{ inputs.file }}"
        category: "${{ inputs.category }}"
...
