---
name: "PDM Setup"
description: "Setup PDM and install dev dependencies for opentemplate."
inputs:
  group:
    description: >
      Dev dependencies group to install.
      If unspecified, no group will be installed.
    required: false
    default: ""
  core:
    description: >
      If true, the main and optional dependencies will be installed.
    required: false
    default: "false"
  all:
    description: >
      If true, all dependencies will be installed.
    required: false
    default: "false"
  python-version:
    description: >
      Version range or exact version of a Python version to use,
      using SemVer's version range syntax.
    required: false
    #
    #           DO NOT EDIT UNTIL end marker
    #
    # [[[cog
    # import cog
    # import cogeol
    #
    # cycle = cogeol.scientific()[-1]["cycle"]
    # cog.out(f'    default: "{cycle}"')
    # ]]]
    default: "3.12"
    # [[[end]]] (sum: SoRk4taE1i)

runs:
  using: "composite"
  steps:
    - name: "Validate the group"
      id: "preprocess"
      shell: "bash"
      env:
        GROUP: "${{ inputs.group }}"
      # enq: multiline bash more readable without indentation
      # yamllint disable rule:indentation
      run: |
        if [ -z "${GROUP}" ]; then
          exit 0
        fi

        if ! python - "${GROUP}" <<'PY'
        import sys
        import tomllib

        with open("pyproject.toml", "rb") as file:
            groups = tomllib.load(file).get("dependency-groups", {})

        raise SystemExit(f"dev-{sys.argv[1]}" not in groups)
        PY
        then
          echo "::error title=Invalid group::Dependency group 'dev-${GROUP}' does not exist."
          exit 1
        fi
      # yamllint enable rule:indentation
    - name: "Save original pdm.lock"
      shell: "bash"
      env:
        TEMPORARY: "${{ runner.temp }}"
      run: >
        cp pdm.lock "${TEMPORARY}/pdm.lock"
    - name: "Add cache info to pdm.lock"
      shell: "bash"
      env:
        # enq: complex multiline expression more readable with indentation
        # yamllint disable rule:indentation
        CACHE_CONTENT: >-
          ${{
            inputs.all == 'false'
            && format(
              '{0}-{1}-{2}',
              inputs.core == 'false' && 'no-core' || 'core',
              inputs.group == '' && 'no-group' || inputs.group,
              inputs.python-version
            )
            || format('all-{0}', inputs.python-version)
          }}
        # yamllint enable rule:indentation
        TEMPORARY: "${{ runner.temp }}"
      run: |
        echo "# ${CACHE_CONTENT}" >> pdm.lock
        echo "::info:: Cache type '${CACHE_CONTENT}'"
    - name: "Setup Caching PDM"
      id: "setup-pdm"
      # enq: hash with name and version always longer than 80 chars
      # yamllint disable rule:line-length
      uses: "pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37" # v4.6
      # yamllint enable rule:line-length
      with:
        python-version: "${{ inputs.python-version }}"
        cache: true
        cache-restore-exact-match: true
    - name: "Restore original pdm.lock"
      shell: "bash"
      env:
        TEMPORARY: "${{ runner.temp }}"
      run: >
        mv "${TEMPORARY}/pdm.lock" ./
    - name: "PDM Compatibility"
      # enq: hash with name and version always longer than 80 chars
      # yamllint disable rule:line-length
      # enq: unpinned as it allows projects to use the latest
      uses: "$/.github/actions/pdm-compatibility"
      # yamllint enable rule:line-length

    - name: "Install group dependencies"
      if: >
        inputs.all == 'false'
        && inputs.group != ''
      shell: "bash"
      env:
        GROUP: "${{ inputs.group }}"
      run: >
        pdm install --no-self --no-default -G "dev-${GROUP}" --no-editable
    - name: "Install core dependencies"
      if: >
        inputs.all == 'false'
        && inputs.core == 'true'
      shell: "bash"
      run: >
        pdm install --prod -G:all --no-editable
    - name: "Install everything"
      shell: "bash"
      env:
        group: "${{ inputs.group }}"
      if: >
        inputs.all == 'true'
      run: >
        pdm install -G:all --no-editable

    - name: "PDM Compatibility"
      # enq: hash with name and version always longer than 80 chars
      # yamllint disable rule:line-length
      # enq: unpinned as it allows projects to use the latest
      uses: "$/.github/actions/pdm-compatibility"
      # yamllint enable rule:line-length
      with:
        restore: true
...
