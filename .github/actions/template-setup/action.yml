---
name: "Template Setup"
description: "Setup opennudge/opentemplate template"

inputs:
  template-repository:
    description: >
      Name of the template repository
    required: true
  repository:
    description: >
      A name of the repository to create
    required: true
  template-owner:
    description: >
      Owner of the template repository
    required: true
  owner:
    description: >
      Owner of the repository to create
    required: true
  template-description:
    description: >
      Description of the template repository
    required: true
  description:
    description: >
      Description of the repository
    required: true

runs:
  using: "composite"
  steps:
    - name: "Remove template-only blocks"
      shell: "bash"
      run: >
        ./template-setup/delete-blocks.sh
    - name: "Remove template specific dependent data (e.g. links)"
      shell: "bash"
      run: >
        rm -rf docs/template/index.md docs/template/README.md
    - name: "Recreate template specific data independently"
      shell: "bash"
      run: |
        cp -r README.md docs/template/README.md
        cd docs/template
        ln -s README.md index.md
    - name: "Remove project-specific directories"
      shell: "bash"
      run: >
        rm -rf src tests
    - name: "Overwrite files"
      env:
        TEMPLATE_REPOSITORY: "${{ inputs.template-repository }}"
        REPOSITORY: "${{ inputs.repository }}"
      shell: "bash"
      # || true if the directory is named the same as the template repository
      run: |
        cp -r template-setup/overwrite/* .
        mv "src/${TEMPLATE_REPOSITORY}" "src/${REPOSITORY}" || true
    - name: "Change template data"
      shell: "bash"
      env:
        TEMPLATE_REPOSITORY: "${{ inputs.template-repository }}"
        REPOSITORY: "${{ inputs.repository }}"
        TEMPLATE_OWNER: "${{ inputs.template-owner }}"
        OWNER: "${{ inputs.owner }}"
        TEMPLATE_DESCRIPTION: "${{ inputs.template-description }}"
        DESCRIPTION: "${{ inputs.description }}"
        SKIP_N_LINES: "6"
        EXCLUDE_LIST: >
          ./docs/template
          ./.cache
          ./.git
          ./.github/actions
          ./.github/workflows
      run: >
        ./template-setup/rename.sh
        "${TEMPLATE_REPOSITORY}"
        "${REPOSITORY}"
        "${TEMPLATE_OWNER}"
        "${OWNER}"
        "${TEMPLATE_DESCRIPTION}"
        "${DESCRIPTION}"
        "${SKIP_N_LINES}"
        "${EXCLUDE_LIST}"
    # We can now work in standard working-directory
    # Cookiecutter recreated original repository at the same location
    - name: "Create .gitignore header and specific entries"
      shell: "bash"
      # REUSE-IgnoreStart
      run: |
        echo '# SPDX-FileCopyrightText: © 2026 GitHub <https://github.com>
        #
        # SPDX-License-Identifier: CC0-1.0

        mutants
        .python-version
        .venvs
        .lycheecache
        ' > .gitignore
      # REUSE-IgnoreEnd
    - name: "Add the latest Python .gitignore"
      shell: "bash"
      run: >
        curl
        https://raw.githubusercontent.com/github/gitignore/main/Python.gitignore
        >> .gitignore
    - name: "Setup uv"
      uses: "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884" # v10.3.0
      with:
        version-file: "uv.lock"
    - name: "Create uv.lock"
      shell: "bash"
      run: >
        uv lock
    - name: "Add uv.lock license"
      shell: "bash"
      # REUSE-IgnoreStart
      run: |
        echo "SPDX-FileCopyrightText: NONE" > uv.lock.license
        echo "" >> uv.lock.license
        echo "SPDX-License-Identifier: CC0-1.0" >> uv.lock.license
      # REUSE-IgnoreEnd
    - name: "Remove trailing whitespace from .gitignore"
      shell: "bash"
      run: >
        sed --in-place 's/[[:space:]]\+$//' .gitignore
    - name: "Install markdown formatter"
      shell: "bash"
      run: >
        uv sync --only-group dev-tasks --only-group dev-markdown
    - name: "Run markdown formatting"
      continue-on-error: true
      shell: "bash"
      run: >
        uv run --no-sync poe -v fix-markdown $(git diff --name-only -- '*.md')
    - name: "Make all files executable"
      shell: "bash"
      run: >
        find . -type f -name "*.sh" -exec chmod a+x {} +
    - name: "Git status"
      shell: "bash"
      run: >
        git status
...
