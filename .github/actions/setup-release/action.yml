---
name: "Setup Release"
description: >
  Install release tooling from the pinned reusable base workflow repository
  into ./template, so the calling repository cannot alter how releases are built

inputs:
  group:
    description: "Dependency group to install for release tooling"
    default: "dev-release"
  python-version:
    description: "Python version used by PDM and the template tools"
    #
    #           DO NOT EDIT UNTIL end marker
    #
    # [[[cog
    # import cog
    # import cogeol
    #
    # cycle = cogeol.scientific()[-1]["cycle"]
    # cog.out(f'    default: "{cycle}"')
    # ]]]
    default: "3.12"
    # [[[end]]] (sum: SoRk4taE1i)
  sparse-checkout:
    description: >
      Additional paths (newline separated) of the template repository
      to checkout besides pyproject.toml, pdm.lock
      and .github/requirements.txt
    default: ""

runs:
  using: "composite"
  steps:
    # Empty identity would silently checkout the caller as the template
    - name: "Verify template identity"
      shell: "bash"
      env:
        TEMPLATE_REPOSITORY: "${{ job.workflow_repository }}"
        TEMPLATE_SHA: "${{ job.workflow_sha }}"
      # enq: shell indentation is more readable
      # yamllint disable rule:indentation
      run: |
        if [[ -z "${TEMPLATE_REPOSITORY}" || -z "${TEMPLATE_SHA}" ]]; then
          echo "::error title=Unknown template::Cannot resolve template workflow identity"
          exit 1
        fi
      # yamllint enable rule:indentation
    - name: "Checkout template repository"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      with:
        repository: "${{ job.workflow_repository }}"
        ref: "${{ job.workflow_sha }}"
        path: "template"
        sparse-checkout: |
          /pyproject.toml
          /pdm.lock
          /.github/requirements.txt
          ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: "Setup Python"
      uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
      with:
        python-version: "${{ inputs.python-version }}"
    # Hash-locked, exported from pdm.lock (see pdm-bootstrap hook)
    - name: "Install PDM"
      shell: "bash"
      run: >
        python -m pip install --require-hashes --no-deps
        --requirement template/.github/requirements.txt
    - name: "Install template release tools"
      shell: "bash"
      env:
        GROUP: "${{ inputs.group }}"
      # enq: single line more readable
      # yamllint disable rule:line-length
      run: >
        pdm sync --project template --no-self --no-default --group "${GROUP}" --no-editable
      # yamllint enable rule:line-length
...
