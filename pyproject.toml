[build-system]
build-backend = "hatchling.build"

requires = [
  "hatchling>=1",
  "comver[hatchling]>=1",
]

[project]
name = "opentemplate"

description = "All-in-one Python template. One click. Everything included."
readme = "README.md"

license = "Apache-2.0"
maintainers = [
  { name = "open-nudge" },
]
authors = [
  { name = "open-nudge" },
]
#
#           DO NOT EDIT UNTIL end marker
#
# [[[cog
# import cog
# import cogeol
#
# cycle = cogeol.scientific()[-1]["cycle"]
# cog.out(f'requires-python = ">={cycle}"')
# ]]]
requires-python = ">=3.13"
# [[[end]]] (sum: zX38HHIAaw)

# Full list of classifiers: https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  #
  #           DO NOT EDIT UNTIL end marker
  #
  # [[[cog
  # import cog
  # import cogeol
  #
  # for version in reversed(cogeol.scientific()):
  #     cycle = version["cycle"]
  #     cog.outl(f'  "Programming Language :: Python :: {cycle}",')
  # ]]]
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  # [[[end]]] (sum: Z4mtja39mg)
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []
dynamic = [ "version" ]

urls.Changelog = "https://github.com/open-nudge/opentemplate/blob/main/CHANGELOG.md"
urls.Documentation = "https://open-nudge.github.io/opentemplate"
urls.Homepage = "https://open-nudge.github.io/opentemplate"
urls.Issues = "https://github.com/open-nudge/opentemplate/issues"
urls.Repository = "https://github.com/open-nudge/opentemplate"

[dependency-groups]
dev-tests = [
  # Fuzz/property testing for Python
  "coverage>=7",
  "hypothesis>=6",
  "mutmut>=3",
  "pyrefly>=0.64.1",
  "pytest>=8",
  "pytest-asyncio>=1",
  "pytest-env>=1",
  "pytest-github-actions-annotate-failures>=0.3",
  "pytest-html>=4",
  "pytest-markdown-docs>=0.9",
  "pytest-mock>=3",
  "pytest-pretty-terminal>=1",
  "pytest-randomly>=3",
  "pytest-socket>=0.7",
  "pytest-timeout>=2",
]

dev-docs = [
  # Needed for mkdocs-social
  "cairosvg>=2",
  "markdown>=3",
  "mike>=2",
  "mkdocs-awesome-nav>=3",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-git-revision-date-localized-plugin>=1",
  "mkdocs-github-admonitions-plugin>=0.0.3",
  "mkdocs-jupyter>=0.25.1",
  "mkdocs-link-marker>=0.1.3",
  "mkdocs-literate-nav>=0.6.0",
  "mkdocs-material>=9",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-open-in-new-tab>=1",
  "mkdocs-redirects>=1",
  "mkdocs-section-index>=0.3.4",
  "mkdocstrings>=0.25.0",
  "mkdocstrings-python>=1",
  # Needed for mkdocs-social
  "pillow>=10",
  "pygments>=2",
  "pymdown-extensions>=10",
  "termynal>=0.12.1",
]

dev-python = [
  "interrogate>=1",
  "ruff>=0.5.6",
  "pynudger>=3",
  "noqaexplain>=2",
]

dev-typing = [
  # Needed to type check testing as well
  { include-group = "dev-tests" },
]

dev-shell = [
  "shellcheck-py>=0.10.0",
  "noqaexplain>=2",
]

dev-yaml = [
  "yamllint>=1",
  "noqaexplain>=2",
]

dev-markdown = [
  "mdformat>=0.7.19",
  "mdformat_frontmatter>=2",
  "mdformat_footnote>=0.1.1",
  "mdformat-gfm>=0.3.7",
  "mdformat_gfm_alerts>=1",
  "mdformat-mkdocs>=4",
  "pymarkdownlnt>=0.9.21",
]

dev-ini = [
  "pyinilint>=0.17",
]

dev-pyproject = [
  "validate-pyproject>=0.18",
]

dev-citation = [
  "check-jsonschema>=0.31.2",
]

dev-github = [
  "zizmor>=1",
  "check-jsonschema>=0.31.2",
]

dev-legal = [
  "reuse>=4",
]

# Installed from the template by the security workflows (see setup-release)
dev-security = [
  # No Windows support; pinned pygit2 and yara-python lack Python 3.14 wheels
  "guarddog>=3.2.0; sys_platform != 'win32' and python_version < '3.14'",
  "zizmor>=1",
]

# Exported (hashed) to .github/requirements.txt, installs uv in release jobs
dev-bootstrap = [
  "uv>=0.11.8",
]

# Task runner, all tasks are run via `uv run poe <task>`
dev-tasks = [
  "poethepoet>=0.37",
]

# templatedelete-start
# Exported (hashed) to template-setup/requirements.txt, used by template-setup.yml
# Block removed during template setup (template-setup/delete-blocks.sh)
dev-template-setup = [
  "cookiecutter>=2",
]
# templatedelete-end

dev-build = [
  "hatchling>=1",
  "comver[hatchling]>=1",
]

dev-release = [
  "spdx-tools>=0.8.3",
  "cyclonedx-bom>=7",
  "git-cliff>=2",
  "reuse>=4",
]

dev-generation = [
  "cogapp>=3",
  "cogeol>=0.1.5",
]

dev-commit = [
  "conventional-pre-commit>=4",
]

dev-prek = [
  "prek>=0.3.4",
]

dev-json = [
  "prek>=0.3.4",
]

dev-json5 = [
  "prek>=0.3.4",
]

dev-toml = [
  "prek>=0.3.4",
]

dev-xml = [
  "prek>=0.3.4",
]

dev-text = [
  "codespell>=2",
  "prek>=0.3.4",
]

# Groups below are currently taken mostly out of the prek-hooks,
# each separated to be more semantically coherent and expandable.

dev-all = [
  { include-group = "dev-tasks" },
  { include-group = "dev-tests" },
  { include-group = "dev-docs" },
  { include-group = "dev-python" },
  { include-group = "dev-typing" },
  { include-group = "dev-shell" },
  { include-group = "dev-yaml" },
  { include-group = "dev-markdown" },
  { include-group = "dev-ini" },
  { include-group = "dev-pyproject" },
  { include-group = "dev-text" },
  { include-group = "dev-citation" },
  { include-group = "dev-github" },
  { include-group = "dev-legal" },
  { include-group = "dev-security" },
  { include-group = "dev-build" },
  { include-group = "dev-release" },
  { include-group = "dev-generation" },
  { include-group = "dev-commit" },
  { include-group = "dev-prek" },
  { include-group = "dev-json" },
  { include-group = "dev-json5" },
  { include-group = "dev-toml" },
  { include-group = "dev-xml" },
]

###############################################################################
#
#                             SETTINGS
#
###############################################################################

[tool.hatch.version]
source = "comver"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/opentemplate",
  "LICENSES",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentemplate"]

[tool.uv]
required-version = ">=0.11.8"
package = true
exclude-newer = "1 week"
default-groups = [ "dev-all" ]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**" },
  { git = { commit = true, tags = true } },
]
# Cooldown exemptions for fixes of known vulnerabilities, see SECURITY-DEPENDENCY.md
exclude-newer-package = { certifi = "2026-10-20T02:24:16.604828Z", pillow = "2026-10-16T22:18:09.718711Z", uv = "2026-10-20T15:12:06.801164Z" }

# Vulnerability IDs (any alias), each with a reason in a comment
[tool.uv.audit]
ignore = []
# Advisories without a fix, reported again once a fix is released
ignore-until-fixed = []

[tool.ruff]
line-length = 110
src = [
  "src",
  "tests",
]
extend-exclude = [
  ".pytest_cache",
  ".venv",
  ".venvs",
  "build",
  "site",
]
unsafe-fixes = false

show-fixes = true

format.docstring-code-format = true
lint.external = [
  "PYNUDGER",
]
lint.select = [
  "ALL",
]
lint.extend-ignore = [
  "ANN401",
  # ruff recommended for fixer compatibility
  "COM812",
  # simplify implicit str concatenation (ruff-format recommended)
  "ISC001",
  # Prefer absolute imports over relative imports from parent modules
  "TID252",
  # While correct, semgrep does not support this yet
  "UP046",
  "UP047",
  # Incorrectly flags proper licenses
  "CPY001",
]

lint.extend-per-file-ignores."tests/**.py" = [
  # Pytest should not be a module
  "INP001",
  "S101",
]
lint.extend-per-file-ignores.".github/tools/*.py" = [
  # Standalone scripts, not a package
  "INP001",
]
lint.extend-per-file-ignores."template-setup/overwrite/tests/**.py" = [
  # Pytest should not be a module
  "INP001",
  "S101",
]
lint.flake8-bandit.check-typed-exception = true
lint.flake8-boolean-trap.extend-allowed-calls = [
  "django.db.models.Value",
  "pydantic.Field",
]
lint.flake8-builtins.builtins-allowed-modules = [
  "id",
]
lint.flake8-import-conventions.banned-from = [
  "numpy",
  "pandas",
  "polars",
  "typing",
]
lint.flake8-pytest-style.parametrize-values-type = "tuple"
lint.flake8-type-checking.strict = true
lint.isort.detect-same-package = false
lint.isort.lines-between-types = 1
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.isort.section-order = [
  "future",
  "standard-library",
  "third-party",
  # Additional section for machine learning
  "ml",
  # Additional section for pytest
  "testing",
  "first-party",
  "local-folder",
]
lint.isort.sections.ml = [
  "pandas",
  "numpy",
  "polars",
  "matplotlib",
  "seaborn",
  "scipy",
  "sklearn",
  "statsmodels",
  "nltk",
  "spacy",
  "gensim",
  "tensorflow",
  "torch",
  "pytorch-lightning",
  "lightning",
  "coremltools",
  "torchmetrics",
  "xgboost",
  "lightgbm",
  "catboost",
  "fastai",
  "mlflow",
  "neptune",
  "dvc",
  "wandb",
  "dask",
  "pyspark",
]
lint.isort.sections.testing = [ "pytest*", "hypothesis" ]
lint.mccabe.max-complexity = 6
lint.pep8-naming.classmethod-decorators = [
  "pydantic.validator",
]
lint.pycodestyle.max-doc-length = 80
# Detecting very long lines
lint.pycodestyle.max-line-length = 120

lint.pydocstyle.convention = "google"
lint.pydocstyle.ignore-decorators = [ "typing.overload" ]

# These are largely opinionated, adjust as needed
lint.pylint.max-branches = 6
lint.pylint.max-locals = 10
lint.pylint.max-nested-blocks = 3
lint.pylint.max-public-methods = 10
lint.pylint.max-returns = 5
lint.pylint.max-statements = 20

[tool.codespell]
skip = "*uv.lock,*.venv/*,*.venvs/*"
ignore-words-list = "intoto"
check-filenames = true
interactive = 0

[tool.coverage.run]
branch = true
relative_files = true
source = [
  "src",
  "tests",
]
source_pkgs = [
  "opentemplate",
]
[tool.coverage.paths]
source = [
  "src/opentemplate",
  "**/opentemplate",
]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]
partial_branches = [
  "#\\s*(pragma|PRAGMA)[:\\s]?\\s*(no|NO)\\s*(branch|BRANCH)",
]

fail_under = 100
precision = 2
show_missing = true
skip_empty = true

[tool.interrogate]
verbose = 1
style = "google"
fail-under = 100
exclude = [
  "build",
  "tests",
  ".pytest_cache",
  ".venv",
  ".venvs",
  "site",
]

[tool.pytest.ini_options]
strict = true
addopts = [
  # Summary of all non-passed outcomes (failed, skipped, xfailed etc.)
  "-ra",
  "--durations=10",
  "--markdown-docs",
  # Use @pytest.mark.enable_socket to allow network for specific tests
  "--disable-socket",
  # asyncio event loops need local socket pairs
  "--allow-unix-socket",
]
# Per-test timeout in seconds
timeout = 300
filterwarnings = [
  "error",
]
env = [
  "PYTHONDEVMODE=1",
]
testpaths = [
  "tests",
  "src",
  "docs",
]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".venv",
  ".venvs",
  "build",
  "site",
  "docs/scripts",
]

[tool.pyrefly]
project-includes = [
  "src",
  "tests",
  "docs/scripts",
]

[tool.mutmut]
use_setproctitle = false
do_not_mutate_patterns = [
    'logger\.\w+',
    'raise \w+',
]
source_paths = [
  "src/",
]
# Markdown code blocks are tests too (symlinks are copied as files)
also_copy = [
  "docs/",
]
pytest_add_cli_args_test_selection = [
  "tests/",
  "src/",
  "docs/",
]
type_check_command = [
  "pyrefly",
  "check",
  "--output-format=json",
  # mutants/ is gitignored, so pyrefly would otherwise skip all files
  "--use-ignore-files=false",
]

[tool.pymarkdown]
# Disabled as it does not play well with GitHub admonitions
plugins.md007.enabled = false
plugins.md028.enabled = false
plugins.md033.enabled = false
plugins.md034.enabled = false
# Disabled as the first line is SPDX license header
plugins.md041.enabled = false
plugins.md042.enabled = false
# Disabled as it conflicts with mdformat around pyml pragmas
# (pymarkdownlnt 0.9.41 counts the pragma line as blank)
plugins.md012.enabled = false

[tool.comver]
path_includes = [
  "src/*",
  "pyproject.toml",
]

message_excludes = [
  ".*\\[no version\\].*",
  ".*\\[skip version\\].*",
  ".*\\[version skip\\].*",
]

author_name_excludes = [
  ".*\\[bot\\].*",
]

[tool.git-cliff.changelog]
header = """
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{#- "true" if commit has PR labels (with/without label) and matching author -#}
{%- macro matches(commit, label="", contains=true, bot="ignore") -%}
  {%- set labels = commit.remote.pr_labels | default(value=[]) -%}
  {%- set is_bot = "[bot]" in commit.author.name -%}
  {{- (not label or (labels and contains and label in labels) or (labels and not contains and label not in labels))
    and (bot == "ignore" or (bot and is_bot) or (not bot and not is_bot)) -}}
{%- endmacro -%}

{%- macro count(commits, label="", contains=true, bot="ignore") -%}
  {%- set_global n = 0 -%}
  {%- for commit in commits -%}
    {%- set match = self::matches(commit=commit, label=label, contains=contains, bot=bot) -%}
    {%- if match == "true" -%}{%- set_global n = n + 1 -%}{%- endif -%}
  {%- endfor -%}
  {{- n -}}
{%- endmacro -%}

{%- macro display(commits, header, python, labels, url, bot=false, display_group=false) -%}
  {%- set n = self::count(commits=commits, label="python", contains=python, bot=bot) -%}
  {%- if n != "0" %}

### {{ header }} ({{ n }} commits)
{% endif -%}
  {%- for commit in commits -%}
    {%- set match = self::matches(commit=commit, label="python", contains=python, bot=bot) -%}
    {%- if match == "true" %}
- {% if display_group %}[{% if commit.group == "feat" %}FEATURE{% else %}FIX{% endif %}] {% endif -%}
  {{ commit.message | split(pat="\n") | first | upper_first | trim }}
  {%- if commit.remote.username %} (by [__@{{ commit.remote.username }}__](https://github.com/{{ commit.remote.username }}))
  {%- elif "[bot]" in commit.author.name %} (by __@{{ commit.author.name }}__ [BOT])
  {%- elif commit.author.name %} (by __@{{ commit.author.name }}__)
  {%- endif -%}
  {%- if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ url }}/pull/{{ commit.remote.pr_number }})){% endif -%}
  {%- for label in commit.remote.pr_labels | default(value=[]) -%}
    {%- if label in labels %} [{{ label | upper }}]{% endif -%}
  {%- endfor -%}
    {%- endif -%}
  {%- endfor -%}
{%- endmacro -%}

{%- set url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo %}
{% if version -%}
  {%- set name = version | trim_start_matches(pat="v") -%}
  {%- if previous.version %}{% set name = "[" ~ name ~ "](" ~ url ~ "/compare/" ~ previous.version ~ ".." ~ version ~ ")" %}{% endif %}
# {{ name }} - {{ timestamp | date(format="%Y-%m-%d") }} ([vs HEAD]({{ url }}/compare/{{ version }}..HEAD))
{%- else %}
# Untagged ([vs HEAD]({{ url }}/compare/..HEAD))
{%- endif %}

__Commits by type__

{% set human = self::count(commits=commits, bot=false) -%}
{%- set bots = self::count(commits=commits, bot=true) -%}
{%- set py = self::count(commits=commits, label="python") -%}
{%- set other = self::count(commits=commits, label="python", contains=false) -%}
Total | Human | Bots | Python | Other
:---: | :---: | :---: | :---: | :---:
{{ commits | length }} | {{ human }} | {{ bots }} | {{ py }} | {{ other }}

__Commits by labels__

{% set labels = ["security", "tests", "legal", "docs", "actions", "config", "deps"] -%}
Security | Tests | Legal | Docs | Actions | Config | Dependencies
:---: | :---: | :---: | :---: | :---: | :---: | :---:
{% for label in labels %}{{ self::count(commits=commits, label=label) }}{% if not loop.last %} | {% endif %}{% endfor %}

{%- set repositories = get_env(name="PACKAGE_REPOSITORIES", default="") | trim -%}
{%- set package_version = get_env(name="PYTHON_PACKAGE_VERSION", default="") -%}
{%- for python in [true, false] -%}
  {%- set n = self::count(commits=commits, label="python", contains=python) -%}
  {%- if n != "0" %}

## {% if python %}Python ({% if package_version %}v{{ package_version }}, {% endif %}{% else %}Other ({% endif %}{{ n }} commits)
    {%- if python and repositories %}

### Repositories

{{ repositories }}
    {%- endif -%}
    {%- set non_breaking = commits | filter(attribute="breaking", value=false) -%}
    {{- self::display(commits=commits | filter(attribute="breaking", value=true), header="Breaking changes", python=python, labels=labels, url=url, display_group=true) -}}
    {{- self::display(commits=non_breaking | filter(attribute="group", value="feat"), header="Features", python=python, labels=labels, url=url) -}}
    {{- self::display(commits=non_breaking | filter(attribute="group", value="fix"), header="Fixes", python=python, labels=labels, url=url) -}}
    {{- self::display(commits=commits, header="Bots", python=python, labels=labels, url=url, bot=true, display_group=true) -}}
  {%- endif -%}
{%- endfor %}
"""

footer = ""
trim = true

[tool.git-cliff.git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# regex for parsing and grouping commits
commit_parsers = [
  { message= "^feat", group = "feat" },
  { message= "^fix", group = "fix" },
]
# filter out the commits that are not matched by commit parsers
filter_commits = true
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"

[tool.poe]
# Tasks run in the environment set up by `uv run` (or uv-setup action in CI)
executor.type = "simple"

[tool.poe.tasks]

###############################################################################
#
#                               TESTING
#
###############################################################################

# SEED (random in CI, see reproducibility-setup action) seeds all randomness
# ./ makes --pyargs treat tests and docs as paths, opentemplate is the installed package
tests-coverage = { sequence = [
  { cmd = "python -X dev -m coverage run -m pytest -vv -x --pretty --doctest-modules --pyargs ${paths:-./tests ./docs opentemplate}" },
  { cmd = "coverage report" },
], args = [
  { name = "paths", positional = true, multiple = true },
], env = { PYTHONHASHSEED = "${SEED:-0}", PYTEST_ADDOPTS = "--randomly-seed=${SEED:-0} --hypothesis-seed=${SEED:-0}" } }
# mutmut disables pytest-randomly (unknown --randomly-seed)
tests-mutation = { cmd = ".github/tools/tests-mutation.sh", env = { PYTHONHASHSEED = "${SEED:-0}", PYTEST_ADDOPTS = "--hypothesis-seed=${SEED:-0}" } }
env-tests = { shell = """
  export UV_PROJECT_ENVIRONMENT="${POE_ROOT}/.venvs/${python}"
  # Outer `uv run` sets VIRTUAL_ENV to .venv, nested uv would warn on mismatch
  export VIRTUAL_ENV="${UV_PROJECT_ENVIRONMENT}"
  uv sync --python "${python}" --no-editable --all-extras --no-default-groups --group dev-tests --group dev-tasks \
    && if [ -n "${task}" ]; then uv run --no-sync --python "${python}" poe ${task}; fi
""", args = [
  { name = "python", options = ["--python"], required = true },
  { name = "task", positional = true, multiple = true },
] }
tests = { sequence = [
  #
  #           DO NOT EDIT UNTIL end marker
  #
  # [[[cog
  # import cog
  # import cogeol
  #
  # cycle = cogeol.scientific()[-1]["cycle"]
  # cog.outl(f'  {{ ref = "env-tests --python {cycle} tests-coverage ${{paths}}" }},')
  # cog.outl(f'  {{ ref = "env-tests --python {cycle} tests-mutation" }},')
  # ]]]
  { ref = "env-tests --python 3.13 tests-coverage ${paths}" },
  { ref = "env-tests --python 3.13 tests-mutation" },
  # [[[end]]] (sum: /BFHkZeaWr)
], args = [
  { name = "paths", positional = true, multiple = true },
] }
tests-all = { sequence = [
  #
  #           DO NOT EDIT UNTIL end marker
  #
  # [[[cog
  # import cog
  # import cogeol
  #
  # for version in cogeol.scientific():
  #     cycle = version["cycle"]
  #     cog.outl(f'  {{ ref = "env-tests --python {cycle} tests-coverage ${{paths}}" }},')
  # cycle = cogeol.scientific()[-1]["cycle"]
  # cog.outl(f'  {{ ref = "env-tests --python {cycle} tests-mutation" }},')
  # ]]]
  { ref = "env-tests --python 3.15 tests-coverage ${paths}" },
  { ref = "env-tests --python 3.14 tests-coverage ${paths}" },
  { ref = "env-tests --python 3.13 tests-coverage ${paths}" },
  { ref = "env-tests --python 3.13 tests-mutation" },
  # [[[end]]] (sum: JgwQgDxvNU)
], args = [
  { name = "paths", positional = true, multiple = true },
] }

###############################################################################
#
#                           CHECKS AND FIXERS
#
###############################################################################

check-python = { sequence = [
  { cmd = "ruff format --check ${files:-.}" },
  { cmd = "ruff check ${files:-.}" },
  { cmd = "pynudger check ${files}" },
  { cmd = "interrogate ${files:-.}" },
  { cmd = "noqaexplain check ${files:-src tests docs/scripts}" },
], args = [
  { name = "files", positional = true, multiple = true },
] }
fix-python = { sequence = [
  { cmd = "ruff format ${files:-.}" },
  { cmd = "ruff check --fix ${files:-.}" },
  { cmd = "pynudger check ${files}" },
  { cmd = "interrogate ${files:-.}" },
  { cmd = "noqaexplain check ${files:-src tests docs/scripts}" },
], args = [
  { name = "files", positional = true, multiple = true },
] }

# Type checks the installed (non-editable) package, not src, and the code using it:
# runs in the test environment (env-tests), whose interpreter pyrefly picks up,
# disabled search path heuristics (src) resolve imports from its site-packages
check-typing = { sequence = [
  #
  #           DO NOT EDIT UNTIL end marker
  #
  # [[[cog
  # import cog
  # import cogeol
  #
  # cycle = cogeol.scientific()[-1]["cycle"]
  # cog.outl(f'  {{ ref = "env-tests --python {cycle} typing-installed" }},')
  # ]]]
  { ref = "env-tests --python 3.13 typing-installed" },
  # [[[end]]] (sum: F8Raasa4Ie)
] }
# Run via check-typing (needs the non-editable test environment),
# flag is not in [tool.pyrefly] so mutmut type checks mutated src
typing-installed = { shell = """
  pyrefly check --disable-search-path-heuristics tests docs/scripts \
    "$(python -P -c 'import opentemplate; print(opentemplate.__path__[0])')"
""" }

check-shell = { sequence = [
  { cmd = "shellcheck -x -S style -o all ${files}" },
  { cmd = "noqaexplain check ${files}" },
], args = [
  { name = "files", positional = true, multiple = true },
] }

fix-shell = { shell = "shellcheck -x -S style -o all ${files} | git apply --allow-empty", args = [
  { name = "files", positional = true, multiple = true },
] }

check-yaml = { sequence = [
  { cmd = "yamllint ${files:-.}" },
  { cmd = "noqaexplain check ${files}" },
], args = [
  { name = "files", positional = true, multiple = true },
] }


# @ is ignored for version pinning in pyproject.toml (as seen in cffconvert)
# issues and blob are ignored as the repo might be private and unreachable
check-markdown = "bash .github/tools/markdown.sh check"
fix-markdown = "bash .github/tools/markdown.sh fix"

check-ini = "pyinilint"

check-pyproject = { cmd = "validate-pyproject ${files:-pyproject.toml}", args = [
  { name = "files", positional = true, multiple = true },
] }

check-citation = { cmd = "check-jsonschema --verbose --builtin-schema vendor.citation-file-format ${files:-CITATION.cff}", args = [
  { name = "files", positional = true, multiple = true },
] }

check-docs = "mkdocs build"

check-prek-config = { cmd = "prek validate-config ${files:-prek.toml}", args = [
  { name = "files", positional = true, multiple = true },
] }
# Skipped when no files are passed and the default manifest does not exist
check-prek-hooks = { shell = """
  if [ -n "${files}" ] || [ -f .pre-commit-hooks.yaml ]; then
    prek validate-manifest ${files:-.pre-commit-hooks.yaml}
  fi
""", args = [
  { name = "files", positional = true, multiple = true },
] }

# Scripts below are (mostly) separated from prek-hooks to group them semantically
# This approach allows opentemplate to run prek checks directly

# See definitions and specification here:
# https://github.com/prek/prek-hooks/blob/main/.prek-hooks.yaml

check-text = "bash .github/tools/text.sh check"
fix-text = "bash .github/tools/text.sh fix"

check-json = "prek run check-json --files"

check-json5 = "prek run check-json5 --files"

check-toml = "prek run check-toml --files"

check-xml = "prek run check-xml --files"

check-github-actions = "check-jsonschema --verbose --builtin-schema vendor.github-actions"

check-github-workflows = { sequence = [
  { cmd = "check-jsonschema --verbose --builtin-schema github-workflows-require-timeout ${files}" },
  { cmd = "check-jsonschema --verbose --builtin-schema github-workflows ${files}" },
], args = [
  { name = "files", positional = true, multiple = true },
] }

check-github = { cmd = "zizmor --persona auditor --verbose", cwd = "${POE_PWD}" }

check-legal = "reuse lint"
fix-legal = { shell = """
  reuse annotate \
    --license="$(.github/tools/license.sh)" \
    --copyright='open-nudge <https://github.com/open-nudge>' \
    --contributor="$(git config get user.name) <$(git config get user.email)>" \
    --copyright-prefix=spdx-symbol \
    --merge-copyrights \
    --recursive \
    --fallback-dot-license \
  ${files:-.}
""", args = [
  { name = "files", positional = true, multiple = true },
] }

# Known vulnerabilities in uv.lock (all groups), ignores in [tool.uv.audit]
check-audit = "uv audit --frozen --preview-features audit-command"

check-generation = { shell = ".github/tools/find-cog-files.sh | xargs -0 -r cog -c --check" }
fix-generation = { shell = ".github/tools/find-cog-files.sh | xargs -0 -r cog -c -r" }

fix-all = "prek run --all-files"

# Used by the commit-msg prek hook
check-commit = "conventional-pre-commit --strict --scopes '' feat fix feat! fix!"

###############################################################################
#
#                 NON-CHECKS (setup, sboms, changelogs etc.)
#
###############################################################################

setup = { sequence = [
  # Project environment (.venv): everything, editable (linters, docs, IDE)
  "uv sync --all-extras",
  # Test environments (.venvs/<python>), missing interpreters are downloaded
  #
  #           DO NOT EDIT UNTIL end marker
  #
  # [[[cog
  # import cog
  # import cogeol
  #
  # for version in cogeol.scientific():
  #     cycle = version["cycle"]
  #     cog.outl(f'  {{ ref = "env-tests --python {cycle}" }},')
  # ]]]
  { ref = "env-tests --python 3.15" },
  { ref = "env-tests --python 3.14" },
  { ref = "env-tests --python 3.13" },
  # [[[end]]] (sum: Ui9IDUjl7k)
  "prek install --install-hooks",
], default_item_type = "cmd" }


# SBOM scripts assess the project in the current directory with tools
# from the invoking environment, e.g. in CI (template tools, source project):
# cd source && uv run --project ../template poe --directory ../template sbom-legal
sbom-python = { shell = """
  cyclonedx-py environment --mc-type library --output-reproducible "${UV_PROJECT_ENVIRONMENT:-.venv}"
""", cwd = "${POE_PWD}" }

sbom-legal = { shell = """
  reuse spdx \
      --add-license-concluded \
      --creator-organization='open-nudge <https://github.com/open-nudge>' \
      --creator-person="$(git config get user.name) <$(git config get user.email)>" \
    > .sbom-legal.spdx \
    && pyspdxtools \
      --version "SPDX-2.2" --novalidation \
      -i .sbom-legal.spdx -o .sbom-legal.json \
    && ( cat .sbom-legal.json && rm .sbom-legal.spdx .sbom-legal.json )
""", cwd = "${POE_PWD}" }

# Pinned GitHub Actions used by .github (and ${SBOM_ACTIONS_EXTRA} directories)
sbom-actions = { shell = '''
grep -rhoE 'uses:[[:space:]]*"?[[:alnum:]_-][^"[:space:]#]*@[^"[:space:]#]+' \
  .github ${SBOM_ACTIONS_EXTRA} \
  | sed -E 's/^uses:[[:space:]]*"?//' \
  | sort -u \
  | jq -Rn --arg epoch "${SOURCE_DATE_EPOCH:-}" '{
      bomFormat: "CycloneDX",
      specVersion: "1.6",
      version: 1,
      metadata: {
        timestamp: (if $epoch == "" then now else ($epoch | tonumber) end | todate)
      },
      components: [
        inputs
        | if startswith("docker://") then
            ltrimstr("docker://")
            | capture("^(?<name>[^:@]+)(:[^@]+)?@(?<version>.+)$")
            | .purl = "pkg:docker/\(.name)@\(.version | sub(":"; "%3A"))"
            | .type = "container"
          else
            capture("^(?<name>[^@]+)@(?<version>.+)$")
            | (.name | split("/")) as $path
            | .purl = "pkg:github/\($path[:2] | join("/"))@\(.version)"
              + if $path[2:] == [] then "" else "#\($path[2:] | join("/"))" end
            | .type = "application"
          end
      ]
    }'
''', cwd = "${POE_PWD}" }

sbom-all = { sequence = [
  "sbom-python",
  "sbom-legal",
  "sbom-actions",
] }

changelog = "git-cliff"
changelog-latest = "git-cliff --latest"

check-release = { sequence = [
  "sbom-all",
  "changelog",
  "changelog-latest",
  "build-dist",
] }

build-dist = { shell = 'SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}" uv build' }

###############################################################################
#
#                             AGENTIC WORKFLOWS
#
###############################################################################

[tool.poe.tasks.harness]
shell = """\
  prek run --color never --show-diff-on-failure --no-progress --quiet --files \
  $(git diff --name-only --cached; git diff --name-only; git ls-files --others --exclude-standard)
"""
