---
# Configuration of the Trivy scans (.github/workflows/_sbom.yml).

# Allowed licenses (exact SPDX identifiers) of the distributed dependencies
# (project.dependencies and project.optional-dependencies) are classified as
# notice (LOW severity) and not reported, any other license (including unknown
# ones) fails the license check.

# NOTE: Dependency groups and GitHub Actions are not distributed, therefore not checked.
license:
  notice:
    - "MIT"
    - "MIT-0"
    - "MIT-CMU"
    - "Apache-2.0"
    - "BSD-2-Clause"
    - "BSD-3-Clause"
    - "ISC"
    - "PSF-2.0"
    - "Python-2.0"
    - "Python-2.0.1"
    - "CNRI-Python"
    - "0BSD"
    - "Unlicense"
    - "CC0-1.0"
    - "Zlib"
    - "OFL-1.1"
    - "BSL-1.0"
    - "HPND"
    - "X11"
    - "NCSA"
    - "UPL-1.0"
    - "Unicode-3.0"
    - "Unicode-DFS-2016"
    - "BlueOak-1.0.0"
    - "PostgreSQL"
    - "MPL-2.0"
    - "LGPL-2.1-only"
    - "LGPL-2.1-or-later"
    - "LGPL-3.0-only"
    - "LGPL-3.0-or-later"
  # enq: the only way to set an empty list in YAML
  forbidden: [] # yamllint disable-line rule:brackets
  # enq: the only way to set an empty list in YAML
  restricted: [] # yamllint disable-line rule:brackets
  # enq: the only way to set an empty list in YAML
  reciprocal: [] # yamllint disable-line rule:brackets
  # enq: the only way to set an empty list in YAML
  permissive: [] # yamllint disable-line rule:brackets
  # enq: the only way to set an empty list in YAML
  unencumbered: [] # yamllint disable-line rule:brackets
...
